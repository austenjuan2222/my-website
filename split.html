        .p-items{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
        .p-items .input{width:96px;min-height:40px;padding:6px 10px}
        .add-item{min-height:40px;padding:0 12px;border-radius:12px;border:1px dashed var(--line-strong);background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;transition:transform 140ms var(--ease-out)}
        .add-item:active{transform:scale(.97)}
        .d-head{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center}

        .icon-btn:active{transform:scale(.94)}
        .big{font-size:clamp(40px,12vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
        .lines{list-style:none;display:grid;gap:6px;font-variant-numeric:tabular-nums}
        .lines li{display:flex;justify-content:space-between;gap:12px;font-size:15.5px}

    <header class="head">
        <span class="eyebrow">Tool 01 · Split the bill</span>
        <h1>聚餐分帳計算機</h1>
        <p class="lead">輸入金額就幫你算好每人要付多少，含服務費、自動進位，結果一鍵貼到群組。</p>
    </header>

    <section class="panel">
        <h2>分帳方式</h2>
        <div class="seg" role="group" aria-label="分帳方式">
            <button type="button" data-mode="even" aria-pressed="true">平均分</button>
            <button type="button" data-mode="items" aria-pressed="false">各點各的</button>
        </div>

        <div id="even-form" style="margin-top:18px">
            <div class="row">
                <label class="field"><span class="label">總金額（元）</span>
                    <input class="input" id="total" type="number" inputmode="decimal" min="0" step="1" placeholder="例如 1280"></label>
                <label class="field"><span class="label">人數</span>
                    <input class="input" id="people" type="number" inputmode="numeric" min="1" step="1" value="4"></label>
            </div>
        </div>

        <div id="items-form" class="hidden" style="margin-top:18px">
            <span class="label">每個人自己點的（點幾道就加幾格）</span>
            <div class="people" id="people-list" style="margin-top:8px"></div>
            <button type="button" class="btn btn-ghost btn-sm" id="add-person" style="margin-top:10px">＋ 加一個人</button>
            <div style="margin-top:22px">
                <span class="label">共用的（鍋底、合菜、運費…），點名字選誰要分</span>
                <div class="people" id="dish-list" style="margin-top:8px"></div>
                <button type="button" class="btn btn-ghost btn-sm" id="add-dish" style="margin-top:10px">＋ 加一道共用</button>
            </div>
        </div>

        <div style="margin-top:16px;display:grid;gap:2px">
            <label class="check"><input type="checkbox" id="service"> 加 10% 服務費</label>
            <label class="check"><input type="checkbox" id="roundup" checked> 每人金額無條件進位到整數元</label>
        </div>
        <label class="field" style="margin-top:8px"><span class="label">誰先付錢？（選填，會寫進結果）</span>
            <input class="input" id="payer" type="text" maxlength="20" placeholder="例如 小明"></label>
    </section>

    <section class="receipt" id="result" aria-live="polite">
        <p class="muted" style="font-size:13px;letter-spacing:.12em">RECEIPT · 分帳結果</p>
        <div id="result-body" style="margin-top:10px">
            <p class="muted">輸入金額後，結果會出現在這裡。</p>
        </div>
        <div class="actions">
            <button type="button" class="btn btn-primary" id="copy" disabled>📋 複製結果</button>
            <button type="button" class="btn btn-ghost" id="share" hidden>分享</button>
        </div>
        <p class="muted" id="copy-status" role="status" style="min-height:1.4em;margin-top:8px;font-size:14px"></p>
    </section>

    <p class="foot">資料只在你的瀏覽器計算，不會上傳。 · <a href="lunch.html">不知道吃什麼？用午餐抽籤 →</a></p>
</div>

<script>
/**
 * 分帳計算（純函式，方便測試）
 * mode 'even'：{total, people}；mode 'items'：{items:[{name, amount}], shared}
 * 回傳 {rows:[{name, amount}], subtotal, service, grand, collected, extra}
 */
function calcSplit(opts) {
    const rate = opts.service ? 0.1 : 0;
    const fix = (n) => Math.round(n * 100) / 100;
    const pay = (n) => opts.roundUp ? Math.ceil(fix(n)) : fix(n);
    let rows = [];
    let subtotal = 0;
    if (opts.mode === 'items') {
        const items = (opts.items || []).filter(p => p);
        const n = items.length;
        if (!n) return null;
        const num = (v) => Math.max(0, Number(v) || 0);
        // 自己點的：amounts 陣列（多道菜）或單一 amount
        const own = items.map(p => Array.isArray(p.amounts) ? p.amounts.reduce((s, v) => s + num(v), 0) : num(p.amount));
        // 共用的：數字＝全部人分；陣列 [{amount, who:[索引]}]，who 空的話＝全部人分
        const dishes = Array.isArray(opts.shared) ? opts.shared : [{ amount: opts.shared }];
        const share = new Array(n).fill(0);
        let sharedTotal = 0;
        dishes.forEach(d => {
            const amt = num(d && d.amount);
            if (!amt) return;
            let who = (d.who || []).filter(i => i >= 0 && i < n);
            if (!who.length) who = items.map((_, i) => i);
            who.forEach(i => { share[i] += amt / who.length; });
            sharedTotal += amt;
        });
        subtotal = own.reduce((s, v) => s + v, 0) + sharedTotal;
        rows = items.map((p, i) => ({
            name: (p.name || '').trim() || '第 ' + (i + 1) + ' 位',
            own: fix(own[i]),
            share: fix(share[i]),
            amount: pay((own[i] + share[i]) * (1 + rate))
        }));
    } else {
        const people = Math.floor(Number(opts.people));
        const total = Number(opts.total);
        if (!(people >= 1) || !(total > 0)) return null;
        subtotal = total;
        const each = pay(total * (1 + rate) / people);
        rows = Array.from({ length: people }, (_, i) => ({ name: '第 ' + (i + 1) + ' 位', amount: each }));
    }
    if (!(subtotal > 0)) return null;
    const service = fix(subtotal * rate);
    const grand = fix(subtotal + service);
    const collected = fix(rows.reduce((s, r) => s + r.amount, 0));
    return { rows, subtotal: fix(subtotal), service, grand, collected, extra: fix(collected - grand) };
}
window.calcSplit = calcSplit;

const $ = (id) => document.getElementById(id);
const money = (n) => '$' + Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 });
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let mode = 'even';
let lastText = '';

let pidSeq = 0;
function addItemInput(box, value = '') {
    const inp = document.createElement('input');
    inp.className = 'input p-amt'; inp.type = 'number'; inp.inputMode = 'decimal'; inp.min = '0'; inp.step = '1';
    inp.placeholder = '0'; inp.setAttribute('aria-label', '一道菜的金額'); inp.value = value;
    box.insertBefore(inp, box.querySelector('.add-item'));
    return inp;
}

function addPerson(name = '', amounts = ['']) {
    const row = document.createElement('div');
    row.className = 'person';
    row.dataset.pid = String(++pidSeq);
    const idx = $('people-list').children.length + 1;
    row.innerHTML = '<div class="p-head"><input class="input p-name" type="text" maxlength="12" aria-label="名字" placeholder="第 ' + idx + ' 位">' +
        '<span class="p-sub">小計 $0</span><button type="button" class="icon-btn" aria-label="移除這個人">×</button></div>' +
        '<div class="p-items"><button type="button" class="add-item">＋ 再一道</button></div>';
    row.querySelector('.p-name').value = name;
    const box = row.querySelector('.p-items');
    amounts.forEach(v => addItemInput(box, v));
    box.querySelector('.add-item').addEventListener('click', () => { addItemInput(box).focus(); });
    row.querySelector('.icon-btn').addEventListener('click', () => {
        if ($('people-list').children.length > 1) { row.remove(); syncWho(); render(); }
    });
    $('people-list').appendChild(row);
    syncWho();
}

function addDish(name = '', amount = '') {
    const row = document.createElement('div');
    row.className = 'dish';
    row.dataset.who = 'all';
    row.innerHTML = '<div class="d-head"><input class="input d-name" type="text" maxlength="12" aria-label="共用項目名稱" placeholder="例如 鍋底">' +
        '<input class="input d-amt" type="number" inputmode="decimal" min="0" step="1" aria-label="共用金額" placeholder="0">' +
        '<button type="button" class="icon-btn" aria-label="移除這道">×</button></div><div class="who" role="group" aria-label="誰要分這道"></div>';
    row.querySelector('.d-name').value = name;
    row.querySelector('.d-amt').value = amount;
    row.querySelector('.icon-btn').addEventListener('click', () => { row.remove(); render(); });
    $('dish-list').appendChild(row);
    syncWho();
}

/** 依目前的人名，重畫每道共用菜的「誰要分」按鈕（用 pid 記住選擇，刪人不會錯位） */
function syncWho() {
    const people = [...document.querySelectorAll('.person')].map((r, i) => ({ pid: r.dataset.pid, name: r.querySelector('.p-name').value.trim() || '第 ' + (i + 1) + ' 位' }));
    document.querySelectorAll('.dish').forEach(d => {
        const sel = d.dataset.who === 'all' ? null : new Set(d.dataset.who.split(',').filter(Boolean));
        const box = d.querySelector('.who'); box.innerHTML = '';
        people.forEach(p => {
            const b = document.createElement('button');
            b.type = 'button'; b.textContent = p.name; b.dataset.pid = p.pid;
            b.setAttribute('aria-pressed', String(!sel || sel.has(p.pid)));
            b.addEventListener('click', () => {
                b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
                const on = [...box.querySelectorAll('button[aria-pressed="true"]')].map(x => x.dataset.pid);
                d.dataset.who = on.length === people.length ? 'all' : on.join(',');
                render();
            });
            box.appendChild(b);
        });
    });
}

function readOpts() {
    const persons = [...document.querySelectorAll('.person')];
    const pids = persons.map(r => r.dataset.pid);
    return {
        mode,
        total: $('total').value,
        people: $('people').value,
        items: persons.map(r => ({ name: r.querySelector('.p-name').value, amounts: [...r.querySelectorAll('.p-amt')].map(i => i.value) })),
        shared: [...document.querySelectorAll('.dish')].map(d => ({
            amount: d.querySelector('.d-amt').value,
            who: d.dataset.who === 'all' ? [] : d.dataset.who.split(',').filter(Boolean).map(pid => pids.indexOf(pid)).filter(i => i >= 0)
        })),
        service: $('service').checked,
        roundUp: $('roundup').checked
    };
}

function render() {
    const opts = readOpts();
    document.querySelectorAll('.person').forEach((row, i) => {
        const sum = opts.items[i].amounts.reduce((t, v) => t + (Math.max(0, Number(v) || 0)), 0);
        row.querySelector('.p-sub').textContent = '小計 ' + money(sum);
    });
    const r = calcSplit(opts);
    const payer = $('payer').value.trim();
    if (!r) {
        $('result-body').innerHTML = '<p class="muted">' + (mode === 'even' ? '輸入總金額和人數（至少 1 人）。' : '輸入每個人點的金額。') + '</p>';
        $('copy').disabled = true; $('share').hidden = true; lastText = '';
        return;
    }
    const same = r.rows.every(x => x.amount === r.rows[0].amount);
    let html = '';
    if (same) {
        html += '<p class="muted" style="font-size:14px">每人付</p><p class="big">' + money(r.rows[0].amount) + '</p>' +
            '<p class="muted" style="margin-top:6px;font-size:14px">共 ' + r.rows.length + ' 人</p>';
    } else {
        html += '<ul class="lines">' + r.rows.map(x => '<li><span>' + esc(x.name) + (x.share ? '<small>自己 ' + money(x.own) + ' ＋ 共用 ' + money(x.share) + '</small>' : '') + '</span><b>' + money(x.amount) + '</b></li>').join('') + '</ul>';
    }
    html += '<hr><ul class="lines muted">' +
        '<li><span>餐點金額</span><span>' + money(r.subtotal) + '</span></li>' +
        (r.service ? '<li><span>服務費 10%</span><span>' + money(r.service) + '</span></li>' : '') +
        '<li><span>應付總額</span><span>' + money(r.grand) + '</span></li>' +
        (r.extra > 0 ? '<li><span>進位後多收（可當零錢／小費）</span><span>' + money(r.extra) + '</span></li>' : '') +
        '</ul>';
    if (payer) html += '<p style="margin-top:12px;font-weight:700">請把錢轉給 ' + esc(payer) + ' 🙏</p>';
    $('result-body').innerHTML = html;

    const lines = ['🧾 聚餐分帳', '應付總額 ' + money(r.grand) + (r.service ? '（含 10% 服務費）' : '')];
    if (same) lines.push('每人 ' + money(r.rows[0].amount) + ' × ' + r.rows.length + ' 人');
    else r.rows.forEach(x => lines.push('・' + x.name + '：' + money(x.amount)));
    if (payer) lines.push('請轉給 ' + payer);
    lines.push('', '用這個算的 👉 https://austenjuan2222.github.io/my-website/split.html');
    lastText = lines.join('\n');
    $('copy').disabled = false;
    $('share').hidden = !navigator.share;
}

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('even-form').classList.toggle('hidden', mode !== 'even');
    $('items-form').classList.toggle('hidden', mode !== 'items');
    render();
}));
$('add-person').addEventListener('click', () => { addPerson(); $('people-list').lastElementChild.querySelector('.p-name').focus(); });
$('add-dish').addEventListener('click', () => { addDish(); $('dish-list').lastElementChild.querySelector('.d-amt').focus(); });
document.addEventListener('input', render);
document.addEventListener('change', render);

$('copy').addEventListener('click', async () => {
    if (!lastText) return;
    let ok = false;
    try { await navigator.clipboard.writeText(lastText); ok = true; } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
        ta.remove();
    }
    $('copy-status').textContent = ok ? '已複製，貼到 LINE 群組就好了 ✅' : '無法自動複製，請手動選取上面的文字。';
    if (ok && window.gtag) gtag('event', 'split_copy', { mode });
});
$('share').addEventListener('click', () => {
    navigator.share({ title: '聚餐分帳', text: lastText }).catch(() => {});
});

for (let i = 0; i < 3; i++) addPerson();
addDish();
document.getElementById('people-list').addEventListener('input', (e) => { if (e.target.classList.contains('p-name')) syncWho(); });
render();
</script>
