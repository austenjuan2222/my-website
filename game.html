<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極限街頭對決：Cyber Fighter - 小遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            touch-action: none;
            user-select: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="text-white font-sans antialiased flex flex-col items-center justify-between min-h-screen p-2 md:p-4 overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="w-full max-w-5xl flex items-center justify-between px-4 py-2 glass-panel rounded-2xl shadow-lg z-20">
        <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold text-sm rounded-xl transition flex items-center space-x-1 shadow">
            <span>← 回首頁</span>
        </a>
        <div class="text-center">
            <h1 class="text-base md:text-xl font-black tracking-widest text-cyan-400">極限街頭對決 (強力自動追蹤版)</h1>
        </div>
        <div class="text-right text-xs md:text-sm font-semibold text-cyan-300">
            最高連勝: <span id="bestStreak" class="text-white text-base">0</span> 連勝
        </div>
    </header>

    <!-- 遊戲畫布 -->
    <main class="relative w-full max-w-5xl aspect-[16/9] max-h-[55vh] glass-panel rounded-3xl overflow-hidden shadow-2xl border border-cyan-500/30 flex items-center justify-center my-2">
        <canvas id="gameCanvas" width="1280" height="720" class="w-full h-full block cursor-default"></canvas>

        <!-- 開始畫面遮罩 -->
        <div id="overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-30">
            <h2 id="overlayTitle" class="text-3xl md:text-5xl font-black mb-3 tracking-wider text-cyan-400">CYBER FIGHTER</h2>
            <p id="overlayDesc" class="text-slate-300 text-sm md:text-base mb-6 max-w-md leading-relaxed">
                操作說明：<br>
                移動：<span class="text-cyan-300 font-bold">A / D</span>｜跳躍：<span class="text-cyan-300 font-bold">空白鍵 / ↑</span><br>
                普攻：<span class="text-amber-400 font-bold">W</span>｜<span class="text-cyan-300 font-bold">強力追蹤氣功(Q)</span>｜衝刺斬(E)<br>
                防禦護盾：按住 <span class="text-blue-400 font-bold">S</span>（完全免疫傷害）
            </p>
            <button id="startBtn" class="px-8 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-lg rounded-2xl shadow-lg transition">
                進入對決
            </button>
        </div>
    </main>

    <!-- 手機觸控面板 -->
    <footer class="w-full max-w-5xl grid grid-cols-2 gap-3 px-2 pb-2 z-20">
        <div class="flex items-center space-x-2">
            <button id="btnLeft" class="flex-1 py-3 bg-slate-800 border border-slate-600 rounded-2xl font-bold text-sm active:bg-cyan-600 shadow">◀ 左</button>
            <button id="btnRight" class="flex-1 py-3 bg-slate-800 border border-slate-600 rounded-2xl font-bold text-sm active:bg-cyan-600 shadow">右 ▶</button>
            <button id="btnShield" class="px-4 py-3 bg-blue-900 border border-blue-500 rounded-2xl font-bold text-sm active:bg-blue-600 shadow text-cyan-200">🛡️ 防</button>
        </div>
        <div class="grid grid-cols-4 gap-1.5">
            <button id="btnJump" class="bg-slate-800 border border-slate-600 rounded-2xl font-bold text-xs active:bg-cyan-600 shadow">跳</button>
            <button id="btnW" class="bg-amber-600 border border-amber-400 rounded-2xl font-black text-sm active:bg-amber-500 shadow">W 普</button>
            <button id="btnQ" class="bg-cyan-600 border border-cyan-400 rounded-2xl font-black text-sm active:bg-cyan-500 shadow">Q 追</button>
            <button id="btnE" class="bg-fuchsia-600 border border-fuchsia-400 rounded-2xl font-black text-sm active:bg-fuchsia-500 shadow">E 斬</button>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'skill') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'shield') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                }
            } catch(e) {}
        }

        let gameState = 'START';
        let bestStreak = parseInt(localStorage.getItem('cyber_fighter_streak') || '0');
        document.getElementById('bestStreak').innerText = bestStreak;

        const keys = {};
        const touchState = { left: false, right: false, jump: false, w: false, q: false, e: false, shield: false };

        window.addEventListener('keydown', e => {
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyQ', 'KeyE', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
                e.preventDefault();
            }
            keys[e.code] = true;
            if (gameState === 'PLAYING') {
                if (e.code === 'KeyW') playerAttackW();
                if (e.code === 'KeyQ') playerAttackQ();
                if (e.code === 'KeyE') playerAttackE();
            }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function bindTouch(id, stateKey) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', e => { e.preventDefault(); touchState[stateKey] = true; if(gameState==='PLAYING' && ['w','q','e'].includes(stateKey)) triggerTouchSkill(stateKey); });
            el.addEventListener('touchend', e => { e.preventDefault(); touchState[stateKey] = false; });
            el.addEventListener('mousedown', e => { touchState[stateKey] = true; if(gameState==='PLAYING' && ['w','q','e'].includes(stateKey)) triggerTouchSkill(stateKey); });
            el.addEventListener('mouseup', e => { touchState[stateKey] = false; });
        }
        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnJump', 'jump');
        bindTouch('btnShield', 'shield');
        bindTouch('btnW', 'w');
        bindTouch('btnQ', 'q');
        bindTouch('btnE', 'e');

        function triggerTouchSkill(key) {
            if (key === 'w') playerAttackW();
            if (key === 'q') playerAttackQ();
            if (key === 'e') playerAttackE();
        }

        class Fighter {
            constructor(x, y, color, isAI) {
                this.x = x; this.y = y;
                this.width = 60; this.height = 110;
                this.vx = 0; this.vy = 0;
                this.color = color; this.isAI = isAI;
                this.hp = 100; this.maxHp = 100;
                this.energy = 0; this.maxEnergy = 100;
                this.isShielding = false;
                this.facing = isAI ? -1 : 1;
                this.attackCooldown = 0;
                this.actionState = 'idle';
                this.actionFrame = 0;
            }

            update(opponent) {
                this.vy += 0.7;
                this.y += this.vy;
                if (this.y + this.height > 620) {
                    this.y = 620 - this.height;
                    this.vy = 0;
                }
                this.x += this.vx;
                this.vx *= 0.8;

                if (this.x < 50) this.x = 50;
                if (this.x > canvas.width - 50 - this.width) this.x = canvas.width - 50 - this.width;

                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.energy < this.maxEnergy && Math.random() < 0.1) {
                    this.energy = Math.min(this.maxEnergy, this.energy + 0.5);
                }
                this.facing = this.x < opponent.x ? 1 : -1;
                if (this.actionFrame > 0) this.actionFrame--;
                else this.actionState = 'idle';
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                if (this.facing === -1) ctx.scale(-1, 1);

                if (this.isShielding) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 75, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#38bdf8';
                    ctx.stroke();
                }

                ctx.fillStyle = this.color;
                ctx.fillRect(-20, 20, 14, 35);
                ctx.fillRect(6, 20, 14, 35);

                ctx.fillStyle = this.color;
                ctx.fillRect(-25, -25, 50, 50);

                ctx.beginPath();
                ctx.arc(0, -42, 18, 0, Math.PI * 2);
                ctx.fillStyle = '#f8fafc';
                ctx.fill();

                ctx.fillStyle = this.color;
                if (this.actionState === 'attack') {
                    ctx.fillRect(15, -15, 45, 14);
                } else {
                    ctx.fillRect(-32, -15, 14, 30);
                    ctx.fillRect(18, -15, 14, 30);
                }
                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, vx, vy, color, type, owner) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.speed = type === 'E' ? 10 : 7;
                this.radius = type === 'E' ? 30 : 18;
                this.color = color; this.type = type;
                this.owner = owner;
                this.active = true;
            }
            update(target) {
                // 強力追蹤：隨時計算目標中心點並直接引導速度向量轉向
                const targetCenterX = target.x + target.width / 2;
                const targetCenterY = target.y + target.height / 2;
                const dx = targetCenterX - this.x;
                const dy = targetCenterY - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 2) {
                    const dirX = dx / dist;
                    const dirY = dy / dist;
                    // 以靈敏的轉向系數直接吸附過去
                    this.vx += (dirX * this.speed - this.vx) * 0.25;
                    this.vy += (dirY * this.speed - this.vy) * 0.25;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.active = false;
                }
            }
            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 25;
                ctx.fill();
                ctx.restore();
            }
        }

        let player, ai, projectiles;

        function initGame() {
            player = new Fighter(300, 510, '#06b6d4', false);
            ai = new Fighter(920, 510, '#ec4899', true);
            projectiles = [];
        }

        function playerAttackW() {
            if (gameState !== 'PLAYING' || player.attackCooldown > 0) return;
            player.attackCooldown = 15;
            player.actionState = 'attack';
            player.actionFrame = 12;
            playSound('hit');
            const dist = Math.abs((player.x + player.width/2) - (ai.x + ai.width/2));
            if (dist < 90 && Math.abs(player.y - ai.y) < 50) applyDamage(ai, 10);
        }

        function playerAttackQ() {
            if (gameState !== 'PLAYING' || player.attackCooldown > 0) return;
            player.attackCooldown = 25;
            player.actionState = 'attack';
            player.actionFrame = 15;
            playSound('skill');
            // 發射時賦予初始速度，隨後由 update 自動強效追蹤
            projectiles.push(new Projectile(player.x + 30, player.y + 30, 6, -2, '#22d3ee', 'Q', 'player'));
        }

        function playerAttackE() {
            if (gameState !== 'PLAYING' || player.energy < 40 || player.attackCooldown > 0) return;
            player.energy -= 40;
            player.attackCooldown = 40;
            player.actionState = 'attack';
            player.actionFrame = 20;
            playSound('skill');
            projectiles.push(new Projectile(player.x + 30, player.y + 20, 8, 0, '#e879f9', 'E', 'player'));
        }

        function applyDamage(target, dmg) {
            if (target.isShielding) {
                playSound('shield');
                return;
            }
            target.hp -= dmg;
            playSound('hit');
            if (target.hp <= 0) {
                target.hp = 0;
                endGame(target === ai ? 'VICTORY' : 'DEFEAT');
            }
        }

        function updateAI() {
            const dist = (player.x + player.width/2) - (ai.x + ai.width/2);
            const absDist = Math.abs(dist);
            ai.isShielding = false;

            if (Math.random() < 0.03 && absDist < 120) {
                ai.isShielding = true;
                return;
            }
            if (absDist > 100) {
                ai.vx = dist > 0 ? 3.5 : -3.5;
            } else if (absDist < 70) {
                ai.vx = dist > 0 ? -2.5 : 2.5;
                if (Math.random() < 0.15 && ai.attackCooldown === 0) {
                    ai.attackCooldown = 25;
                    ai.actionState = 'attack';
                    ai.actionFrame = 12;
                    playSound('hit');
                    if (absDist < 90) applyDamage(player, 8);
                }
            }
            // AI 施放追蹤氣功波
            if (Math.random() < 0.02 && ai.attackCooldown === 0 && ai.energy >= 30) {
                ai.energy -= 30;
                ai.attackCooldown = 45;
                playSound('skill');
                projectiles.push(new Projectile(ai.x, ai.y + 30, -6, -2, '#f472b6', 'Q', 'ai'));
            }
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            player.isShielding = keys['KeyS'] || touchState.shield;
            if (!player.isShielding) {
                if (keys['KeyA'] || touchState.left) player.vx = -6;
                if (keys['KeyD'] || touchState.right) player.vx = 6;
                if ((keys['Space'] || keys['ArrowUp'] || touchState.jump) && player.y >= 510) {
                    player.vy = -16;
                    touchState.jump = false;
                }
            }

            updateAI();
            player.update(ai);
            ai.update(player);

            // 更新所有投射物，並自動吸附追蹤目標
            projectiles.forEach(p => {
                const target = p.owner === 'player' ? ai : player;
                p.update(target);
            });
            projectiles = projectiles.filter(p => p.active);

            // 碰撞檢測
            projectiles.forEach(p => {
                const target = p.owner === 'player' ? ai : player;
                const targetCenterX = target.x + target.width / 2;
                const targetCenterY = target.y + target.height / 2;
                const distToTarget = Math.hypot(p.x - targetCenterX, p.y - targetCenterY);

                if (distToTarget < p.radius + 30) {
                    applyDamage(target, p.type === 'E' ? 30 : 15);
                    p.active = false;
                }
            });

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地板
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 620, canvas.width, 100);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, 620); ctx.lineTo(canvas.width, 620); ctx.stroke();

            player.draw();
            ai.draw();
            projectiles.forEach(p => p.draw());

            // 血條
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fillRect(50, 30, 350, 30);
            ctx.fillStyle = '#06b6d4';
            ctx.fillRect(50, 30, 350 * (player.hp / player.maxHp), 30);
            ctx.strokeStyle = '#fff'; ctx.strokeRect(50, 30, 350, 30);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fillRect(canvas.width - 400, 30, 350, 30);
            ctx.fillStyle = '#ec4899';
            const aiHpW = 350 * (ai.hp / ai.maxHp);
            ctx.fillRect(canvas.width - 50 - aiHpW, 30, aiHpW, 30);
            ctx.strokeRect(canvas.width - 400, 30, 350, 30);

            requestAnimationFrame(gameLoop);
        }

        function endGame(result) {
            gameState = 'GAMEOVER';
            const overlay = document.getElementById('overlay');
            overlay.style.display = 'flex';
            const title = document.getElementById('overlayTitle');
            const desc = document.getElementById('overlayDesc');

            if (result === 'VICTORY') {
                title.innerText = '勝利！ VICTORY';
                bestStreak++;
                localStorage.setItem('cyber_fighter_streak', bestStreak);
                document.getElementById('bestStreak').innerText = bestStreak;
                desc.innerHTML = `恭喜擊敗對手！<br>目前連勝紀錄：<span class="text-cyan-400 font-bold">${bestStreak}</span> 連勝`;
            } else {
                title.innerText = '敗北... DEFEAT';
                desc.innerText = '再接再厲！善用追蹤氣功波與防禦來贏得勝利。';
            }
            document.getElementById('startBtn').innerText = '再次挑戰';
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            initGame();
            gameState = 'PLAYING';
            document.getElementById('overlay').style.display = 'none';
            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
</html>
