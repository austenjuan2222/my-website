<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>極限街頭對決：Cyber Fighter - 小遊戲</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="games.css">
    <style>
        body{touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;
             display:flex;flex-direction:column;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
        .shell{position:relative;z-index:1;width:100%;max-width:1024px;display:flex;flex-direction:column;gap:10px}

        /* 標題列 */
        .stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 6px 0}
        .stage-head h1{font-size:clamp(18px,2.6vw,24px);font-weight:900;letter-spacing:-.01em;margin-top:2px}
        .stage-head h1 small{font-size:.62em;font-weight:600;color:var(--muted);margin-left:8px;letter-spacing:0}
        .stage-tools{display:flex;align-items:center;gap:12px}

        /* 遊戲舞台 */
        .stage{position:relative;width:100%;aspect-ratio:16/9;max-height:55vh;margin:0 auto;border-radius:var(--radius-lg);overflow:hidden;
               border:1px solid var(--line-strong);box-shadow:0 30px 80px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.04);
               background:
                 radial-gradient(60% 70% at 50% 100%, rgba(93,240,168,.10), transparent 70%),
                 linear-gradient(180deg, rgba(16,24,48,.85) 0%, rgba(8,12,28,.92) 100%)}
        .stage canvas{display:block;width:100%;height:100%}

        /* 疊層（開始／結束／排行榜） */
        .layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;
               background:rgba(4,6,15,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-y:auto}
        #overlay{z-index:30}
        #leaderboardModal{z-index:40;background:rgba(4,6,15,.9)}
        .ov-title{font-size:clamp(30px,5.4vw,56px);font-weight:900;letter-spacing:.04em;line-height:1}
        .ov-title.idle{background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
        .ov-title.win{color:var(--warn);text-shadow:0 0 40px rgba(255,211,107,.35)}
        .ov-title.lose{color:var(--p2);text-shadow:0 0 40px rgba(255,122,144,.3)}
        .guide{padding:16px 18px;border-radius:var(--radius);background:var(--glass);border:1px solid var(--line);display:grid;gap:8px;justify-items:center}
        .guide-label{font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--muted-2);text-transform:uppercase}
        .guide-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
        .guide-tip{font-size:12.5px;color:var(--warn);margin-top:2px}
        .upload{display:grid;gap:10px;justify-items:center;padding:14px 16px;border-radius:var(--radius);background:rgba(93,240,168,.06);border:1px solid rgba(93,240,168,.2)}
        .upload p{font-size:13.5px;color:var(--muted)}
        .upload p b{color:var(--ink);font-size:17px}
        .upload-row{display:flex;gap:8px}
        .field{width:160px;padding:10px 14px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);font-size:14px;font-weight:600;text-align:center;outline:none;transition:border-color .2s ease}
        .field::placeholder{color:var(--muted-2)}
        .field:focus{border-color:var(--accent)}
        #submitScoreBtn.is-done{color:var(--muted);background:rgba(255,255,255,.06);box-shadow:none}

        /* 排行榜 */
        .lb-title{font-size:clamp(22px,3.4vw,30px);font-weight:900}
        .lb{width:100%;max-width:440px;max-height:60%;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:var(--glass-2);border:1px solid var(--line)}
        .lb table{width:100%;border-collapse:collapse;font-size:14px;text-align:left;color:var(--muted)}
        .lb thead th{padding:11px 16px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);border-bottom:1px solid var(--line)}
        .lb .scroll{overflow-y:auto;flex:1}
        .lb .scroll::-webkit-scrollbar{width:6px}
        .lb .scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:10px}
        .lb td{padding:11px 16px;border-bottom:1px solid var(--line)}
        .lb tr.top td{background:rgba(255,211,107,.06)}
        .lb .rank{width:64px;font-size:17px;font-weight:800}
        .lb .pname{color:var(--ink);font-weight:700}
        .lb .score{text-align:right;font-weight:800;font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
        .lb .msg{text-align:center;padding:22px 16px}
        .lb .msg.err{color:var(--danger)}
        .loading{animation:pulse 1.2s ease-in-out infinite}
        @keyframes pulse{50%{opacity:.45}}
        .lb table{table-layout:fixed}.th-rank{width:64px}.th-score,.lb .score{width:110px;text-align:right}

        /* 觸控／滑鼠操作區（鍵帽造型） */
        .pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .pad-group{display:flex;gap:8px}
        .pad .key{flex:1;min-height:52px;font-size:14px;border-radius:16px;cursor:pointer;transition:transform .1s var(--ease-out),background-color .15s ease,border-color .15s ease}
        .pad .key:active,.pad .key.is-down{transform:scale(.96) translateY(1px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35);border-color:var(--accent)}
        .pad-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        .key.k-shield{flex:1.3}

        @media (max-width:720px){
          .stage-head h1 small{display:none}
          .pad{grid-template-columns:1fr}
        }
        /* 疊層內容太高時可在疊層內捲動，且不會把上緣切掉 */
        .layer{justify-content:safe center;touch-action:pan-y}
        @media (max-width:720px){
          /* 手機舞台很矮：鍵盤說明改由下方按鈕代替，只留提示 */
          .layer{gap:10px;padding:12px}
          .guide{padding:8px 12px;background:none;border:0}
          .guide-label,.guide-row{display:none}
          .ov-title{font-size:28px}
          .gbtn-lg{min-height:46px;padding:11px 26px;font-size:16px}
        }
        @media (max-width:520px){
          .stage-head .eyebrow{display:none}
        }
    </style>
</head>
<body>
<div class="shell">
    <!-- 共用頂列 -->
    <header class="gbar">
        <a href="index.html" class="gbar-brand" title="回首頁"><b>▲</b><span>Meng-Jie</span></a>
        <nav class="gswitch" aria-label="切換遊戲">
            <a href="game.html" aria-current="page"><span class="gs-icon">🥊</span>格鬥對決</a>
            <a href="rps.html"><span class="gs-icon">✊</span>猜拳對決</a>
        </nav>
        <div class="gbar-right">
            <button id="btnLeaderboard" class="gbtn gbtn-ghost gbtn-sm">🏆 排行榜</button>
        </div>
    </header>

    <div class="stage-head">
        <div>
            <span class="eyebrow">Cyber Fighter</span>
            <h1>極限街頭對決<small>護盾吸血版</small></h1>
        </div>
        <div class="stage-tools">
            <span class="stat">最高連勝 <b id="bestStreak">0</b></span>
        </div>
    </div>

    <main class="stage">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>

        <div id="overlay" class="layer">
            <h2 id="overlayTitle" class="ov-title idle">CYBER FIGHTER</h2>

            <div class="guide">
                <p class="guide-label">操作指引</p>
                <div class="guide-row">
                    <span class="key t-accent"><kbd>Q</kbd>氣功</span>
                    <span class="key t-warn"><kbd>W</kbd>普攻</span>
                    <span class="key t-info"><kbd>S</kbd>護盾(無敵)</span>
                </div>
                <div class="guide-row">
                    <span class="key"><kbd>A</kbd>左移</span>
                    <span class="key"><kbd>空白鍵</kbd>跳躍</span>
                    <span class="key"><kbd>D</kbd>右移</span>
                </div>
                <p class="guide-tip">💡 成功攻擊到對手，可恢復 5 點黃色護盾值！</p>
            </div>

            <div id="scoreUploadSection" class="upload hidden">
                <p>上傳你的最高連勝紀錄：<b id="uploadScoreDisplay" class="num">0</b></p>
                <div class="upload-row">
                    <input type="text" id="playerName" maxlength="10" placeholder="輸入玩家暱稱" class="field">
                    <button id="submitScoreBtn" class="gbtn gbtn-primary gbtn-sm">上傳</button>
                </div>
            </div>

            <button id="startBtn" class="gbtn gbtn-primary gbtn-lg">進入對決</button>
        </div>

        <div id="leaderboardModal" class="layer hidden">
            <h2 class="lb-title">🏆 頂尖對決排行榜</h2>
            <div class="lb">
                <table>
                    <thead><tr><th class="th-rank">名次</th><th>神手暱稱</th><th class="th-score">連勝次數</th></tr></thead>
                </table>
                <div class="scroll">
                    <table>
                        <tbody id="leaderboardBody">
                            <tr><td colspan="3" class="msg loading">連線至伺服器讀取中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <button id="closeLeaderboardBtn" class="gbtn gbtn-ghost gbtn-md">關閉</button>
        </div>
    </main>

    <footer class="pad">
        <div class="pad-group">
            <button id="btnLeft" class="key"><kbd>A</kbd>◀ 左</button>
            <button id="btnRight" class="key">右 ▶<kbd>D</kbd></button>
            <button id="btnShield" class="key t-info k-shield"><kbd>S</kbd>護盾</button>
        </div>
        <div class="pad-actions">
            <button id="btnJump" class="key"><kbd>␣</kbd>跳躍</button>
            <button id="btnW" class="key t-warn"><kbd>W</kbd>普攻</button>
            <button id="btnQ" class="key t-accent"><kbd>Q</kbd>氣功</button>
        </div>
    </footer>
</div>

    <script>
        // 💡 加入強制等待網頁讀取完成的防呆機制
        window.onload = function() {
            const API_URL = "https://script.google.com/macros/s/AKfycbxmCEFAT7KaGqLnhl8K2TvDvQhFd5J0H7d0mbtrseqNGwSy63KJJ2RtAM-TR_DSnVAR/exec";
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            let bestStreak = 0;
            try {
                const stored = localStorage.getItem('cyber_fighter_streak');
                bestStreak = stored ? parseInt(stored) : 0;
                if(isNaN(bestStreak)) bestStreak = 0;
            } catch (e) {
                bestStreak = 0;
                console.log("LocalStorage 被阻擋");
            }
            document.getElementById('bestStreak').innerText = bestStreak;

            // ====== 排行榜邏輯 ======
            document.getElementById('submitScoreBtn').addEventListener('click', () => {
                const name = document.getElementById('playerName').value.trim();
                if (!name) return alert('請先輸入帥氣的暱稱！');

                const btn = document.getElementById('submitScoreBtn');
                btn.innerText = '上傳中...';
                btn.disabled = true;

                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ name: name, score: bestStreak }) 
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        btn.innerText = '✅ 已上傳';
                        btn.classList.add('is-done');
                        alert('成績上傳成功，世界將記得你的名號！');
                    } else {
                        alert('上傳失敗：' + data.message);
                        resetSubmitButton(btn);
                    }
                })
                .catch(err => {
                    resetSubmitButton(btn);
                });
            });

            function resetSubmitButton(btn) {
                btn.innerText = '上傳';
                btn.disabled = false;
                btn.classList.remove('is-done');
            }

            document.getElementById('btnLeaderboard').addEventListener('click', () => {
                document.getElementById('leaderboardModal').classList.remove('hidden');
                const tbody = document.getElementById('leaderboardBody');
                tbody.innerHTML = '<tr><td colspan="3" class="msg loading">連線至伺服器讀取中...</td></tr>';

                fetch(API_URL + "?action=getTop10")
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        tbody.innerHTML = '';
                        if(data.data.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="3" class="msg">目前尚無挑戰者，搶下第一吧！</td></tr>';
                            return;
                        }
                        data.data.forEach((row, index) => {
                            let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `<span class="num">${index + 1}</span>`;
                            let rowClass = index === 0 ? 'top' : '';
                            
                            tbody.innerHTML += `
                                <tr class="${rowClass}">
                                    <td class="rank">${medal}</td>
                                    <td class="pname">${row.name}</td>
                                    <td class="score">${row.score}</td>
                                </tr>
                            `;
                        });
                    }
                })
                .catch(err => {
                    tbody.innerHTML = '<tr><td colspan="3" class="msg err">讀取失敗，請確認 API 網址是否正確</td></tr>';
                });
            });

            document.getElementById('closeLeaderboardBtn').addEventListener('click', () => {
                document.getElementById('leaderboardModal').classList.add('hidden');
            });

            // ====== 遊戲邏輯與音效 ======
            let audioCtx = null;
            function playSound(type) {
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const now = audioCtx.currentTime;
                    if (type === 'hit') {
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1);
                    } else if (type === 'skill') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2);
                    } else if (type === 'shield') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, now);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                        osc.start(now); osc.stop(now + 0.15);
                    }
                } catch(e) {}
            }

            let gameState = 'START';
            const keys = {};
            const touchState = { left: false, right: false, jump: false, w: false, q: false, shield: false };
            let gameLoopId = null;

            window.addEventListener('keydown', e => {
                if (e.target.tagName === 'INPUT') return; 
                if (e.isComposing || e.keyCode === 229) return; 
                
                if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyQ', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
                    e.preventDefault();
                }
                keys[e.code] = true;
                if (gameState === 'PLAYING') {
                    if (e.code === 'KeyW') playerAttackW();
                    if (e.code === 'KeyQ') playerAttackQ();
                }
            });
            window.addEventListener('keyup', e => { keys[e.code] = false; });

            function bindTouch(id, stateKey) {
                const el = document.getElementById(id);
                if (!el) return;
                // 按下時加上 is-down，讓觸控也有按壓回饋（touchstart 擋掉預設行為後 :active 不一定會觸發）
                ['touchstart', 'mousedown'].forEach(t => el.addEventListener(t, () => el.classList.add('is-down')));
                ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(t => el.addEventListener(t, () => el.classList.remove('is-down')));
                el.addEventListener('touchstart', e => { e.preventDefault(); touchState[stateKey] = true; if(gameState==='PLAYING' && ['w','q'].includes(stateKey)) triggerTouchSkill(stateKey); });
                el.addEventListener('touchend', e => { e.preventDefault(); touchState[stateKey] = false; });
                el.addEventListener('mousedown', e => { touchState[stateKey] = true; if(gameState==='PLAYING' && ['w','q'].includes(stateKey)) triggerTouchSkill(stateKey); });
                el.addEventListener('mouseup', e => { touchState[stateKey] = false; });
            }
            bindTouch('btnLeft', 'left');
            bindTouch('btnRight', 'right');
            bindTouch('btnJump', 'jump');
            bindTouch('btnShield', 'shield');
            bindTouch('btnW', 'w');
            bindTouch('btnQ', 'q');

            function triggerTouchSkill(key) {
                if (key === 'w') playerAttackW();
                if (key === 'q') playerAttackQ();
            }

            class Fighter {
                constructor(x, y, color, isAI) {
                    this.x = x; this.y = y;
                    this.width = 60; this.height = 110;
                    this.vx = 0; this.vy = 0;
                    this.color = color; this.isAI = isAI;
                    this.hp = 100; this.maxHp = 100;
                    
                    this.shieldHp = 50; this.maxShieldHp = 50; 
                    
                    this.energy = 0; this.maxEnergy = 100;
                    this.isShielding = false;
                    this.facing = isAI ? -1 : 1;
                    this.attackCooldown = 0;
                    this.actionState = 'idle';
                    this.actionFrame = 0;
                }

                update(opponent) {
                    this.vy += 0.7;
                    this.y += this.vy;
                    if (this.y + this.height > 620) {
                        this.y = 620 - this.height;
                        this.vy = 0;
                    }
                    this.x += this.vx;
                    this.vx *= 0.8;

                    if (this.x < 50) this.x = 50;
                    if (this.x > canvas.width - 50 - this.width) this.x = canvas.width - 50 - this.width;

                    if (this.attackCooldown > 0) this.attackCooldown--;
                    if (this.energy < this.maxEnergy && Math.random() < 0.1) {
                        this.energy = Math.min(this.maxEnergy, this.energy + 0.5);
                    }
                    this.facing = this.x < opponent.x ? 1 : -1;
                    if (this.actionFrame > 0) this.actionFrame--;
                    else this.actionState = 'idle';
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                    if (this.facing === -1) ctx.scale(-1, 1);

                    if (this.isShielding) {
                        ctx.beginPath();
                        ctx.arc(0, 0, 75, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(124, 199, 255, 0.22)';
                        ctx.fill();
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = '#7cc7ff';
                        ctx.stroke();
                    }

                    ctx.fillStyle = this.color;
                    ctx.fillRect(-20, 20, 14, 35);
                    ctx.fillRect(6, 20, 14, 35);

                    ctx.fillStyle = this.color;
                    ctx.fillRect(-25, -25, 50, 50);

                    ctx.beginPath();
                    ctx.arc(0, -42, 18, 0, Math.PI * 2);
                    ctx.fillStyle = '#f3f6ff';
                    ctx.fill();

                    ctx.fillStyle = this.color;
                    if (this.actionState === 'attack') {
                        ctx.fillRect(15, -15, 45, 14);
                    } else {
                        ctx.fillRect(-32, -15, 14, 30);
                        ctx.fillRect(18, -15, 14, 30);
                    }
                    ctx.restore();
                }
            }

            class Projectile {
                constructor(x, y, vx, vy, color, owner) {
                    this.x = x; this.y = y;
                    this.vx = vx; this.vy = vy;
                    this.speed = 7;
                    this.radius = 18;
                    this.color = color;
                    this.owner = owner;
                    this.active = true;
                }
                update(target) {
                    const targetCenterX = target.x + target.width / 2;
                    const targetCenterY = target.y + target.height / 2;
                    const dx = targetCenterX - this.x;
                    const dy = targetCenterY - this.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist > 2) {
                        const dirX = dx / dist;
                        const dirY = dy / dist;
                        this.vx += (dirX * this.speed - this.vx) * 0.25;
                        this.vy += (dirY * this.speed - this.vy) * 0.25;
                    }

                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                        this.active = false;
                    }
                }
                draw() {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 25;
                    ctx.fill();
                    ctx.restore();
                }
            }

            let player, ai, projectiles;

            function initGame() {
                player = new Fighter(300, 510, '#5df0a8', false);
                ai = new Fighter(920, 510, '#ff7a90', true);
                projectiles = [];
            }

            function playerAttackW() {
                if (gameState !== 'PLAYING' || player.attackCooldown > 0) return;
                player.attackCooldown = 15;
                player.actionState = 'attack';
                player.actionFrame = 12;
                playSound('hit');
                const dist = Math.abs((player.x + player.width/2) - (ai.x + ai.width/2));
                if (dist < 90 && Math.abs(player.y - ai.y) < 50) applyDamage(ai, 10, player);
            }

            function playerAttackQ() {
                if (gameState !== 'PLAYING' || player.attackCooldown > 0 || player.energy < 30) return;
                player.energy -= 30; 
                player.attackCooldown = 25;
                player.actionState = 'attack';
                player.actionFrame = 15;
                playSound('skill');
                projectiles.push(new Projectile(player.x + 30, player.y + 30, 6, -2, '#5df0a8', 'player'));
            }

            function applyDamage(target, dmg, attacker) {
                if (target.isShielding) {
                    playSound('shield');
                    return; 
                }

                if (target.shieldHp > 0) {
                    if (target.shieldHp >= dmg) {
                        target.shieldHp -= dmg;
                        dmg = 0;
                    } else {
                        dmg -= target.shieldHp;
                        target.shieldHp = 0; 
                    }
                }
                
                target.hp -= dmg;
                playSound('hit');

                if (attacker && attacker.shieldHp < attacker.maxShieldHp) {
                    attacker.shieldHp = Math.min(attacker.maxShieldHp, attacker.shieldHp + 5);
                }

                if (target.hp <= 0) {
                    target.hp = 0;
                    endGame(target === ai ? 'VICTORY' : 'DEFEAT');
                }
            }

            function updateAI() {
                const dist = (player.x + player.width/2) - (ai.x + ai.width/2);
                const absDist = Math.abs(dist);
                ai.isShielding = false;

                const isEnraged = ai.hp < (ai.maxHp * 0.5);
                const moveSpeed = isEnraged ? 4.5 : 3.5;
                const attackChance = isEnraged ? 0.25 : 0.15;

                if (Math.random() < (isEnraged ? 0.05 : 0.03) && absDist < 120) {
                    ai.isShielding = true;
                    return;
                }

                if (absDist > 85) {
                    ai.vx = dist > 0 ? moveSpeed : -moveSpeed;
                } else {
                    if (absDist < 50) {
                        ai.vx = dist > 0 ? -2.5 : 2.5;
                    }
                    
                    if (Math.random() < attackChance && ai.attackCooldown === 0) {
                        ai.attackCooldown = isEnraged ? 15 : 25; 
                        ai.actionState = 'attack';
                        ai.actionFrame = 12;
                        playSound('hit');
                        if (absDist < 90) applyDamage(player, isEnraged ? 12 : 8, ai); 
                    }
                }

                if (Math.random() < 0.015 && ai.y >= 510) {
                    ai.vy = -16;
                }

                if (ai.attackCooldown === 0) {
                    const dir = dist > 0 ? 1 : -1;
                    if (Math.random() < 0.02 && ai.energy >= 30) {
                        ai.energy -= 30;
                        ai.attackCooldown = 45;
                        playSound('skill');
                        projectiles.push(new Projectile(ai.x, ai.y + 30, 6 * dir, -2, '#ff9fb0', 'ai'));
                    }
                }
            }

            function gameLoop() {
                if (gameState !== 'PLAYING') return;

                player.isShielding = keys['KeyS'] || touchState.shield;
                if (!player.isShielding) {
                    if (keys['KeyA'] || keys['ArrowLeft'] || touchState.left) player.vx = -6;
                    if (keys['KeyD'] || keys['ArrowRight'] || touchState.right) player.vx = 6;
                    if ((keys['Space'] || keys['ArrowUp'] || touchState.jump) && player.y >= 510) {
                        player.vy = -16;
                        touchState.jump = false;
                    }
                }

                updateAI();
                player.update(ai);
                ai.update(player);

                projectiles.forEach(p => {
                    const target = p.owner === 'player' ? ai : player;
                    p.update(target);
                });
                projectiles = projectiles.filter(p => p.active);

                projectiles.forEach(p => {
                    const target = p.owner === 'player' ? ai : player;
                    const attacker = p.owner === 'player' ? player : ai; 
                    const targetCenterX = target.x + target.width / 2;
                    const targetCenterY = target.y + target.height / 2;
                    const distToTarget = Math.hypot(p.x - targetCenterX, p.y - targetCenterY);

                    if (distToTarget < p.radius + 30) {
                        applyDamage(target, 15, attacker); 
                        p.active = false;
                    }
                });

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'rgba(4, 6, 15, 0.55)';
                ctx.fillRect(0, 620, canvas.width, 100);
                ctx.strokeStyle = 'rgba(93, 240, 168, 0.55)';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, 620); ctx.lineTo(canvas.width, 620); ctx.stroke();

                player.draw();
                ai.draw();
                projectiles.forEach(p => p.draw());
                
                // 玩家血條介面
                ctx.fillStyle = 'rgba(4, 6, 15, 0.75)';
                ctx.fillRect(50, 30, 350, 20);
                ctx.fillStyle = '#5df0a8';
                ctx.fillRect(50, 30, 350 * (player.hp / player.maxHp), 20);
                ctx.strokeStyle = 'rgba(243, 246, 255, 0.35)'; ctx.strokeRect(50, 30, 350, 20);

                ctx.fillStyle = 'rgba(4, 6, 15, 0.75)';
                ctx.fillRect(50, 55, 350, 10);
                ctx.fillStyle = '#ffd36b';
                ctx.fillRect(50, 55, 350 * (player.shieldHp / player.maxShieldHp), 10);
                ctx.strokeStyle = '#ffd36b'; ctx.strokeRect(50, 55, 350, 10);
                
                ctx.fillStyle = 'rgba(4, 6, 15, 0.75)';
                ctx.fillRect(50, 70, 200, 10);
                ctx.fillStyle = '#7cc7ff';
                ctx.fillRect(50, 70, 200 * (player.energy / player.maxEnergy), 10);

                // 電腦血條介面
                ctx.fillStyle = 'rgba(4, 6, 15, 0.75)';
                ctx.fillRect(canvas.width - 400, 30, 350, 20);
                ctx.fillStyle = '#ff7a90';
                const aiHpW = 350 * (ai.hp / ai.maxHp);
                ctx.fillRect(canvas.width - 50 - aiHpW, 30, aiHpW, 20);
                ctx.strokeStyle = 'rgba(243, 246, 255, 0.35)'; ctx.strokeRect(canvas.width - 400, 30, 350, 20);
                
                ctx.fillStyle = 'rgba(4, 6, 15, 0.75)';
                ctx.fillRect(canvas.width - 400, 55, 350, 10);
                ctx.fillStyle = '#ffd36b';
                const aiShieldW = 350 * (ai.shieldHp / ai.maxShieldHp);
                ctx.fillRect(canvas.width - 50 - aiShieldW, 55, aiShieldW, 10);
                ctx.strokeStyle = '#ffd36b'; ctx.strokeRect(canvas.width - 400, 55, 350, 10);

                ctx.fillStyle = 'rgba(4, 6, 15, 0.75)';
                ctx.fillRect(canvas.width - 250, 70, 200, 10);
                ctx.fillStyle = '#ff9fb0';
                const aiEnW = 200 * (ai.energy / ai.maxEnergy);
                ctx.fillRect(canvas.width - 50 - aiEnW, 70, aiEnW, 10);

                gameLoopId = requestAnimationFrame(gameLoop);
            }

            function endGame(result) {
                gameState = 'GAMEOVER';
                const overlay = document.getElementById('overlay');
                overlay.style.display = 'flex';
                const title = document.getElementById('overlayTitle');

                resetSubmitButton(document.getElementById('submitScoreBtn'));

                if (result === 'VICTORY') {
                    title.innerText = '勝利！ VICTORY';
                    title.className = 'ov-title win';
                    bestStreak++;
                    try { localStorage.setItem('cyber_fighter_streak', bestStreak); } catch(e){}
                    document.getElementById('bestStreak').innerText = bestStreak;
                    document.getElementById('startBtn').innerText = '迎戰下一位對手';
                } else {
                    title.innerText = '敗北... DEFEAT';
                    title.className = 'ov-title lose';
                    document.getElementById('startBtn').innerText = '重新挑戰';
                }

                if (bestStreak > 0) {
                    document.getElementById('scoreUploadSection').classList.remove('hidden');
                    document.getElementById('uploadScoreDisplay').innerText = bestStreak;
                } else {
                    document.getElementById('scoreUploadSection').classList.add('hidden');
                }
            }

            // 💡 修正按鈕點擊，確保能正確啟動
            document.getElementById('startBtn').addEventListener('click', () => {
                
                // 強制喚醒音效引擎 (解決 Safari 卡死問題)
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                } catch(e) {}

                initGame();
                gameState = 'PLAYING';
                document.getElementById('overlay').style.display = 'none';
                
                if (document.getElementById('overlayTitle').innerText.includes('敗北')) {
                    bestStreak = 0;
                    try { localStorage.setItem('cyber_fighter_streak', 0); } catch(e){}
                    document.getElementById('bestStreak').innerText = '0';
                }
                
                if (gameLoopId) cancelAnimationFrame(gameLoopId);
                gameLoopId = requestAnimationFrame(gameLoop);
            });
        };
    </script>
</body>
</html>
