<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極限街頭對決：Cyber Fighter - 小遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            touch-action: none;
            user-select: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        /* 自訂滾動條給排行榜用 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
    </style>
</head>
<body class="text-white font-sans antialiased flex flex-col items-center justify-between min-h-screen p-2 md:p-4 overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="w-full max-w-5xl flex items-center justify-between px-4 py-2 glass-panel rounded-2xl shadow-lg z-20">
        <div class="flex space-x-2">
            <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold text-sm rounded-xl transition flex items-center shadow">
                <span>← 回首頁</span>
            </a>
            <!-- 🏆 排行榜按鈕 -->
            <button id="btnLeaderboard" class="px-4 py-2 bg-cyan-700 hover:bg-cyan-600 border border-cyan-500 text-white font-bold text-sm rounded-xl transition shadow">
                🏆 排行榜
            </button>
        </div>
        <div class="text-center hidden md:block">
            <h1 class="text-base md:text-xl font-black tracking-widest text-cyan-400">極限街頭對決 (強力自動追蹤版)</h1>
        </div>
        <div class="text-right text-xs md:text-sm font-semibold text-cyan-300">
            最高連勝: <span id="bestStreak" class="text-white text-base">0</span> 連勝
        </div>
    </header>

    <!-- 遊戲畫布 -->
    <main class="relative w-full max-w-5xl aspect-[16/9] max-h-[55vh] glass-panel rounded-3xl overflow-hidden shadow-2xl border border-cyan-500/30 flex items-center justify-center my-2">
        <canvas id="gameCanvas" width="1280" height="720" class="w-full h-full block cursor-default"></canvas>

        <!-- 開始/結束畫面遮罩 -->
        <div id="overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-30">
            <h2 id="overlayTitle" class="text-3xl md:text-5xl font-black mb-3 tracking-wider text-cyan-400">CYBER FIGHTER</h2>
            <p id="overlayDesc" class="text-slate-300 text-sm md:text-base mb-4 max-w-md leading-relaxed">
                操作說明：<br>
                移動：<span class="text-cyan-300 font-bold">A / D</span>｜跳躍：<span class="text-cyan-300 font-bold">空白鍵 / ↑</span><br>
                普攻：<span class="text-amber-400 font-bold">W</span>｜<span class="text-cyan-300 font-bold">強力追蹤氣功(Q)</span>｜衝刺斬(E)<br>
                防禦護盾：按住 <span class="text-blue-400 font-bold">S</span>（完全免疫傷害）
            </p>

            <!-- 📝 分數上傳區塊 (預設隱藏) -->
            <div id="scoreUploadSection" class="mb-6 flex flex-col items-center space-y-3 hidden bg-slate-900/50 p-4 rounded-2xl border border-cyan-900/50">
                <p class="text-cyan-300 text-sm font-bold">上傳你的最高連勝紀錄：<span id="uploadScoreDisplay" class="text-white text-lg">0</span></p>
                <div class="flex space-x-2">
                    <input type="text" id="playerName" maxlength="10" placeholder="輸入玩家暱稱" class="px-3 py-2 rounded-xl bg-slate-800 text-white font-bold outline-none border-2 border-cyan-500 focus:border-cyan-300 w-40 text-center text-sm shadow-inner placeholder-slate-500">
                    <button id="submitScoreBtn" class="px-5 py-2 bg-green-500 hover:bg-green-400 text-slate-950 font-black rounded-xl shadow transition text-sm">上傳</button>
                </div>
            </div>

            <button id="startBtn" class="px-8 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-lg rounded-2xl shadow-lg transition">
                進入對決
            </button>
        </div>

        <!-- 🏆 排行榜 Modal (預設隱藏) -->
        <div id="leaderboardModal" class="hidden absolute inset-0 bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-center p-4 text-center z-40">
            <h2 class="text-2xl md:text-3xl font-black mb-4 text-amber-400 drop-shadow-md">🏆 頂尖對決排行榜 🏆</h2>
            <div class="w-full max-w-md bg-slate-800 rounded-xl shadow-2xl border border-cyan-500/30 overflow-hidden mb-6 flex flex-col max-h-[60%]">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900 text-cyan-300 shadow-md">
                        <tr>
                            <th class="px-4 py-3 font-black">名次</th>
                            <th class="px-4 py-3 font-black">神手暱稱</th>
                            <th class="px-4 py-3 text-right font-black">連勝次數</th>
                        </tr>
                    </thead>
                </table>
                <div class="overflow-y-auto custom-scrollbar flex-1">
                    <table class="w-full text-left text-sm text-slate-300">
                        <tbody id="leaderboardBody">
                            <tr><td colspan="3" class="text-center py-6 text-cyan-400 animate-pulse">連線至伺服器讀取中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <button id="closeLeaderboardBtn" class="px-8 py-2 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl transition shadow-lg border border-slate-500">關閉</button>
        </div>
    </main>

    <!-- 手機觸控面板 -->
    <footer class="w-full max-w-5xl grid grid-cols-2 gap-3 px-2 pb-2 z-20">
        <div class="flex items-center space-x-2">
            <button id="btnLeft" class="flex-1 py-3 bg-slate-800 border border-slate-600 rounded-2xl font-bold text-sm active:bg-cyan-600 shadow">◀ 左</button>
            <button id="btnRight" class="flex-1 py-3 bg-slate-800 border border-slate-600 rounded-2xl font-bold text-sm active:bg-cyan-600 shadow">右 ▶</button>
            <button id="btnShield" class="px-4 py-3 bg-blue-900 border border-blue-500 rounded-2xl font-bold text-sm active:bg-blue-600 shadow text-cyan-200">🛡️ 防</button>
        </div>
        <div class="grid grid-cols-4 gap-1.5">
            <button id="btnJump" class="bg-slate-800 border border-slate-600 rounded-2xl font-bold text-xs active:bg-cyan-600 shadow">跳</button>
            <button id="btnW" class="bg-amber-600 border border-amber-400 rounded-2xl font-black text-sm active:bg-amber-500 shadow">W 普</button>
            <button id="btnQ" class="bg-cyan-600 border border-cyan-400 rounded-2xl font-black text-sm active:bg-cyan-500 shadow">Q 追</button>
            <button id="btnE" class="bg-fuchsia-600 border border-fuchsia-400 rounded-2xl font-black text-sm active:bg-fuchsia-500 shadow">E 斬</button>
        </div>
    </footer>

    <script>
        // ==========================================
        // 🌟 1. 綁定你的 API 網址
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbxmCEFAT7KaGqLnhl8K2TvDvQhFd5J0H7d0mbtrseqNGwSy63KJJ2RtAM-TR_DSnVAR/exec";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // 🌟 2. 排行榜與分數上傳邏輯
        // ==========================================
        
        // 上傳分數
        document.getElementById('submitScoreBtn').addEventListener('click', () => {
            const name = document.getElementById('playerName').value.trim();
            if (!name) return alert('請先輸入帥氣的暱稱！');

            const btn = document.getElementById('submitScoreBtn');
            btn.innerText = '上傳中...';
            btn.disabled = true;

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                // 因為不是 FormData，確保以字串送出 json
                body: JSON.stringify({ name: name, score: bestStreak }) 
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    btn.innerText = '✅ 已上傳';
                    btn.classList.replace('bg-green-500', 'bg-slate-600');
                    btn.classList.replace('hover:bg-green-400', 'hover:bg-slate-600');
                    btn.classList.replace('text-slate-950', 'text-white');
                    alert('成績上傳成功，世界將記得你的名號！');
                } else {
                    alert('上傳失敗：' + data.message);
                    resetSubmitButton(btn);
                }
            })
            .catch(err => {
                console.error(err);
                alert('網路錯誤，請檢查連線後再試');
                resetSubmitButton(btn);
            });
        });

        function resetSubmitButton(btn) {
            btn.innerText = '上傳';
            btn.disabled = false;
            btn.classList.remove('bg-slate-600', 'text-white');
            btn.classList.add('bg-green-500', 'hover:bg-green-400', 'text-slate-950');
        }

        // 開啟與讀取排行榜
        document.getElementById('btnLeaderboard').addEventListener('click', () => {
            document.getElementById('leaderboardModal').classList.remove('hidden');
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-cyan-400 animate-pulse">連線至伺服器讀取中...</td></tr>';

            fetch(API_URL + "?action=getTop10")
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    tbody.innerHTML = '';
                    if(data.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-slate-400">目前尚無挑戰者，搶下第一吧！</td></tr>';
                        return;
                    }
                    data.data.forEach((row, index) => {
                        let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `<span class="text-slate-400 pl-1">${index + 1}</span>`;
                        let rowClass = index === 0 ? 'bg-amber-900/30' : index % 2 === 0 ? 'bg-slate-800/50' : 'bg-transparent';
                        
                        tbody.innerHTML += `
                            <tr class="border-b border-slate-700/50 ${rowClass} transition hover:bg-cyan-900/30">
                                <td class="px-4 py-3 font-black text-lg">${medal}</td>
                                <td class="px-4 py-3 text-white font-bold tracking-wide">${row.name}</td>
                                <td class="px-4 py-3 text-right font-mono font-black text-cyan-400 text-lg">${row.score}</td>
                            </tr>
                        `;
                    });
                }
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-red-400">讀取失敗，請確認 API 網址是否正確</td></tr>';
            });
        });

        // 關閉排行榜
        document.getElementById('closeLeaderboardBtn').addEventListener('click', () => {
            document.getElementById('leaderboardModal').classList.add('hidden');
        });

        // ==========================================
        // 🌟 3. 遊戲邏輯與操作音效
        // ==========================================

        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'skill') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'shield') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                }
            } catch(e) {}
        }

        let gameState = 'START';
        let bestStreak = parseInt(localStorage.getItem('cyber_fighter_streak') || '0');
        document.getElementById('bestStreak').innerText = bestStreak;

        const keys = {};
        const touchState = { left: false, right: false, jump: false, w: false, q: false, e: false, shield: false };

        window.addEventListener('keydown', e => {
            // 如果玩家正在輸入暱稱，不要干擾打字或觸發攻擊
            if (e.target.tagName === 'INPUT') return; 
            
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyQ', 'KeyE', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
                e.preventDefault();
            }
            keys[e.code] = true;
            if (gameState === 'PLAYING') {
                if (e.code === 'KeyW') playerAttackW();
                if (e.code === 'KeyQ') playerAttackQ();
                if (e.code === 'KeyE') playerAttackE();
            }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function bindTouch(id, stateKey) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', e => { e.preventDefault(); touchState[stateKey] = true; if(gameState==='PLAYING' && ['w','q','e'].includes(stateKey)) triggerTouchSkill(stateKey); });
            el.addEventListener('touchend', e => { e.preventDefault(); touchState[stateKey] = false; });
            el.addEventListener('mousedown', e => { touchState[stateKey] = true; if(gameState==='PLAYING' && ['w','q','e'].includes(stateKey)) triggerTouchSkill(stateKey); });
            el.addEventListener('mouseup', e => { touchState[stateKey] = false; });
        }
        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnJump', 'jump');
        bindTouch('btnShield', 'shield');
        bindTouch('btnW', 'w');
        bindTouch('btnQ', 'q');
        bindTouch('btnE', 'e');

        function triggerTouchSkill(key) {
            if (key === 'w') playerAttackW();
            if (key === 'q') playerAttackQ();
            if (key === 'e') playerAttackE();
        }

        class Fighter {
            constructor(x, y, color, isAI) {
                this.x = x; this.y = y;
                this.width = 60; this.height = 110;
                this.vx = 0; this.vy = 0;
                this.color = color; this.isAI = isAI;
                this.hp = 100; this.maxHp = 100;
                this.energy = 0; this.maxEnergy = 100;
                this.isShielding = false;
                this.facing = isAI ? -1 : 1;
                this.attackCooldown = 0;
                this.actionState = 'idle';
                this.actionFrame = 0;
            }

            update(opponent) {
                this.vy += 0.7;
                this.y += this.vy;
                if (this.y + this.height > 620) {
                    this.y = 620 - this.height;
                    this.vy = 0;
                }
                this.x += this.vx;
                this.vx *= 0.8;

                if (this.x < 50) this.x = 50;
                if (this.x > canvas.width - 50 - this.width) this.x = canvas.width - 50 - this.width;

                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.energy < this.maxEnergy && Math.random() < 0.1) {
                    this.energy = Math.min(this.maxEnergy, this.energy + 0.5);
                }
                this.facing = this.x < opponent.x ? 1 : -1;
                if (this.actionFrame > 0) this.actionFrame--;
                else this.actionState = 'idle';
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                if (this.facing === -1) ctx.scale(-1, 1);

                if (this.isShielding) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 75, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#38bdf8';
                    ctx.stroke();
                }

                ctx.fillStyle = this.color;
                ctx.fillRect(-20, 20, 14, 35);
                ctx.fillRect(6, 20, 14, 35);

                ctx.fillStyle = this.color;
                ctx.fillRect(-25, -25, 50, 50);

                ctx.beginPath();
                ctx.arc(0, -42, 18, 0, Math.PI * 2);
                ctx.fillStyle = '#f8fafc';
                ctx.fill();

                ctx.fillStyle = this.color;
                if (this.actionState === 'attack') {
                    ctx.fillRect(15, -15, 45, 14);
                } else {
                    ctx.fillRect(-32, -15, 14, 30);
                    ctx.fillRect(18, -15, 14, 30);
                }
                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, vx, vy, color, type, owner) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.speed = type === 'E' ? 10 : 7;
                this.radius = type === 'E' ? 30 : 18;
                this.color = color; this.type = type;
                this.owner = owner;
                this.active = true;
            }
            update(target) {
                const targetCenterX = target.x + target.width / 2;
                const targetCenterY = target.y + target.height / 2;
                const dx = targetCenterX - this.x;
                const dy = targetCenterY - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 2) {
                    const dirX = dx / dist;
                    const dirY = dy / dist;
                    this.vx += (dirX * this.speed - this.vx) * 0.25;
                    this.vy += (dirY * this.speed - this.vy) * 0.25;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.active = false;
                }
            }
            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 25;
                ctx.fill();
                ctx.restore();
            }
        }

        let player, ai, projectiles;

        function initGame() {
            player = new Fighter(300, 510, '#06b6d4', false);
            ai = new Fighter(920, 510, '#ec4899', true);
            projectiles = [];
        }

        function playerAttackW() {
            if (gameState !== 'PLAYING' || player.attackCooldown > 0) return;
            player.attackCooldown = 15;
            player.actionState = 'attack';
            player.actionFrame = 12;
            playSound('hit');
            const dist = Math.abs((player.x + player.width/2) - (ai.x + ai.width/2));
            if (dist < 90 && Math.abs(player.y - ai.y) < 50) applyDamage(ai, 10);
        }

        function playerAttackQ() {
            if (gameState !== 'PLAYING' || player.attackCooldown > 0) return;
            player.attackCooldown = 25;
            player.actionState = 'attack';
            player.actionFrame = 15;
            playSound('skill');
            projectiles.push(new Projectile(player.x + 30, player.y + 30, 6, -2, '#22d3ee', 'Q', 'player'));
        }

        function playerAttackE() {
            if (gameState !== 'PLAYING' || player.energy < 40 || player.attackCooldown > 0) return;
            player.energy -= 40;
            player.attackCooldown = 40;
            player.actionState = 'attack';
            player.actionFrame = 20;
            playSound('skill');
            projectiles.push(new Projectile(player.x + 30, player.y + 20, 8, 0, '#e879f9', 'E', 'player'));
        }

        function applyDamage(target, dmg) {
            if (target.isShielding) {
                playSound('shield');
                return;
            }
            target.hp -= dmg;
            playSound('hit');
            if (target.hp <= 0) {
                target.hp = 0;
                endGame(target === ai ? 'VICTORY' : 'DEFEAT');
            }
        }

        function updateAI() {
            const dist = (player.x + player.width/2) - (ai.x + ai.width/2);
            const absDist = Math.abs(dist);
            ai.isShielding = false;

            if (Math.random() < 0.03 && absDist < 120) {
                ai.isShielding = true;
                return;
            }
            if (absDist > 100) {
                ai.vx = dist > 0 ? 3.5 : -3.5;
            } else if (absDist < 70) {
                ai.vx = dist > 0 ? -2.5 : 2.5;
                if (Math.random() < 0.15 && ai.attackCooldown === 0) {
                    ai.attackCooldown = 25;
                    ai.actionState = 'attack';
                    ai.actionFrame = 12;
                    playSound('hit');
                    if (absDist < 90) applyDamage(player, 8);
                }
            }
            if (Math.random() < 0.02 && ai.attackCooldown === 0 && ai.energy >= 30) {
                ai.energy -= 30;
                ai.attackCooldown = 45;
                playSound('skill');
                projectiles.push(new Projectile(ai.x, ai.y + 30, -6, -2, '#f472b6', 'Q', 'ai'));
            }
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            player.isShielding = keys['KeyS'] || touchState.shield;
            if (!player.isShielding) {
                if (keys['KeyA'] || touchState.left) player.vx = -6;
                if (keys['KeyD'] || touchState.right) player.vx = 6;
                if ((keys['Space'] || keys['ArrowUp'] || touchState.jump) && player.y >= 510) {
                    player.vy = -16;
                    touchState.jump = false;
                }
            }

            updateAI();
            player.update(ai);
            ai.update(player);

            projectiles.forEach(p => {
                const target = p.owner === 'player' ? ai : player;
                p.update(target);
            });
            projectiles = projectiles.filter(p => p.active);

            projectiles.forEach(p => {
                const target = p.owner === 'player' ? ai : player;
                const targetCenterX = target.x + target.width / 2;
                const targetCenterY = target.y + target.height / 2;
                const distToTarget = Math.hypot(p.x - targetCenterX, p.y - targetCenterY);

                if (distToTarget < p.radius + 30) {
                    applyDamage(target, p.type === 'E' ? 30 : 15);
                    p.active = false;
                }
            });

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 620, canvas.width, 100);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, 620); ctx.lineTo(canvas.width, 620); ctx.stroke();

            player.draw();
            ai.draw();
            projectiles.forEach(p => p.draw());

            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fillRect(50, 30, 350, 30);
            ctx.fillStyle = '#06b6d4';
            ctx.fillRect(50, 30, 350 * (player.hp / player.maxHp), 30);
            ctx.strokeStyle = '#fff'; ctx.strokeRect(50, 30, 350, 30);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fillRect(canvas.width - 400, 30, 350, 30);
            ctx.fillStyle = '#ec4899';
            const aiHpW = 350 * (ai.hp / ai.maxHp);
            ctx.fillRect(canvas.width - 50 - aiHpW, 30, aiHpW, 30);
            ctx.strokeRect(canvas.width - 400, 30, 350, 30);

            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // 🌟 4. 遊戲結束：觸發分數上傳介面
        // ==========================================
        function endGame(result) {
            gameState = 'GAMEOVER';
            const overlay = document.getElementById('overlay');
            overlay.style.display = 'flex';
            const title = document.getElementById('overlayTitle');
            const desc = document.getElementById('overlayDesc');

            // 確保按鈕狀態是重置好的
            resetSubmitButton(document.getElementById('submitScoreBtn'));

            if (result === 'VICTORY') {
                title.innerText = '勝利！ VICTORY';
                title.className = 'text-3xl md:text-5xl font-black mb-3 tracking-wider text-amber-400 drop-shadow-lg';
                bestStreak++;
                localStorage.setItem('cyber_fighter_streak', bestStreak);
                document.getElementById('bestStreak').innerText = bestStreak;
                desc.innerHTML = `恭喜擊敗對手！<br>目前連勝紀錄：<span class="text-amber-400 font-bold text-lg">${bestStreak}</span> 連勝`;
                document.getElementById('startBtn').innerText = '迎戰下一位對手';
            } else {
                title.innerText = '敗北... DEFEAT';
                title.className = 'text-3xl md:text-5xl font-black mb-3 tracking-wider text-red-500 drop-shadow-lg';
                desc.innerText = '勝敗乃兵家常事，把最高紀錄刻在排行榜上吧！';
                document.getElementById('startBtn').innerText = '重新挑戰';
            }

            // 若有連勝紀錄，就顯示輸入框與上傳按鈕
            if (bestStreak > 0) {
                document.getElementById('scoreUploadSection').classList.remove('hidden');
                document.getElementById('uploadScoreDisplay').innerText = bestStreak;
            } else {
                document.getElementById('scoreUploadSection').classList.add('hidden');
            }
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            initGame();
            gameState = 'PLAYING';
            document.getElementById('overlay').style.display = 'none';
            
            // 如果是在敗北後點擊重新挑戰，要將連勝歸零
            if (document.getElementById('overlayTitle').innerText.includes('敗北')) {
                bestStreak = 0;
                localStorage.setItem('cyber_fighter_streak', 0);
                document.getElementById('bestStreak').innerText = '0';
            }
            
            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
