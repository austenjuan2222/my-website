<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>猜拳對決 | 線上對戰</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Firebase（compat 版，一般 script 標籤，不用 type="module"） -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="games.css">
    <style>
        .wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 40px}
        .intro{padding:26px 6px 4px}
        h1{font-size:clamp(30px,8vw,42px);font-weight:900;letter-spacing:-.02em;margin-top:8px}
        .sub{color:var(--muted);margin-top:8px;line-height:1.6}
        .card{margin-top:14px;padding:22px;border-radius:var(--radius);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
        label{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--muted-2);margin-bottom:8px}
        input{width:100%;padding:14px 18px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);font-size:17px;outline:none;transition:border-color .2s ease}
        input::placeholder{color:var(--muted-2)}
        input:focus{border-color:var(--accent)}
        .code-input{text-align:center;font-size:28px;font-weight:800;letter-spacing:.4em;border-radius:16px;font-variant-numeric:tabular-nums}
        /* 這頁的按鈕沿用 class="btn"（程式不需改），外觀對齊 games.css 的 .gbtn */
        .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;font-size:17px;font-weight:700;border-radius:999px;border:1px solid transparent;cursor:pointer;
             transition:transform .16s var(--ease-out),background-color .2s ease,border-color .2s ease,opacity .2s ease}
        .btn:active{transform:scale(.97)}
        .btn:disabled{opacity:.45;cursor:not-allowed}
        .btn-primary{color:var(--accent-ink);background:linear-gradient(180deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px -10px rgba(93,240,168,.6),inset 0 1px 0 rgba(255,255,255,.4)}
        .btn-outline{background:rgba(255,255,255,.05);border-color:var(--line-strong)}
        @media (hover:hover) and (pointer:fine){ .btn-outline:not(:disabled):hover{background:rgba(255,255,255,.1)} }
        .row{display:flex;gap:10px;margin-top:12px}
        .row > *{flex:1}
        .divider{display:flex;align-items:center;gap:12px;color:var(--muted-2);font-size:13px;margin:18px 0}
        .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
        .msg{margin-top:14px;font-size:14px;color:var(--danger);min-height:1em;line-height:1.5}
        .banner{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.6;background:rgba(255,211,107,.1);border:1px solid rgba(255,211,107,.35);color:var(--warn)}

        /* 房間畫面 */
        .room-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
        .room-code{display:flex;gap:6px;font-size:34px;font-weight:900;color:var(--accent);line-height:1;letter-spacing:.3em;font-variant-numeric:tabular-nums}
        .copy{font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);cursor:pointer;transition:transform .16s var(--ease-out),background-color .2s ease}
        .copy:active{transform:scale(.97)}
        .players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
        .player{padding:6px 4px}
        .player .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .player .state{font-size:12.5px;color:var(--muted);margin-top:4px}
        .player .score{font-size:46px;font-weight:900;margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
        .player:first-child .score{color:var(--accent)}
        .player:last-child .score{color:var(--p2)}
        .vs{color:var(--muted-2);font-weight:800;font-size:13px;letter-spacing:.12em}
        .ok{color:var(--accent) !important}
        .off{color:var(--danger) !important}
        .status{text-align:center;font-size:18px;font-weight:700;margin-top:6px;line-height:1.5}
        /* 出拳按鈕：鍵帽造型 */
        .hands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
        .hand{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:20px;cursor:pointer;font-size:44px;
              border:1px solid var(--line-strong);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);
              transition:transform .12s var(--ease-out),border-color .2s ease,background-color .2s ease,box-shadow .12s ease}
        .hand span{font-size:13px;color:var(--muted);font-weight:600}
        .hand:active{transform:scale(.95) translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
        .hand.picked{border-color:var(--accent);background:linear-gradient(180deg,rgba(93,240,168,.24),rgba(93,240,168,.08));box-shadow:inset 0 -1px 0 rgba(0,0,0,.35),0 0 0 4px rgba(93,240,168,.1)}
        .hand.picked span{color:var(--accent)}
        .hand:disabled{cursor:not-allowed;opacity:.5}
        .hand.picked:disabled{opacity:1}
        @media (hover:hover) and (pointer:fine){ .hand:not(:disabled):hover{border-color:rgba(93,240,168,.45)} }
        .reveal{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;margin-top:8px}
        .reveal .big{font-size:64px;line-height:1.1}
        .reveal small{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
        .result{text-align:center;font-size:30px;font-weight:900;margin-top:10px}
        .win{color:var(--warn)} .lose{color:var(--p2)} .draw{color:var(--info)}
        .pop{animation:pop .28s var(--ease-out)}
        @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
        .foot{text-align:center;color:var(--muted-2);font-size:12px;margin-top:28px}
    </style>
</head>
<body>
<div class="wrap">
    <!-- 共用頂列 -->
    <header class="gbar">
        <a href="index.html" class="gbar-home" aria-label="回首頁"><b aria-hidden="true">←</b>首頁</a>
        <nav class="gswitch" aria-label="切換遊戲">
            <a href="game.html"><span class="gs-icon">🥊</span>格鬥對決</a>
            <a href="rps.html" aria-current="page"><span class="gs-icon">✊</span>猜拳對決</a>
        </nav>
    </header>

    <div class="intro">
        <span class="eyebrow">Online Battle</span>
        <h1>✊ 猜拳對決</h1>
        <p class="sub">兩支手機輸入同一個房號，即時對戰。</p>
    </div>

    <div id="configBanner" class="banner hidden">
        ⚠️ 還沒貼上 <b>firebaseConfig</b>，目前無法連線。請在 rps.html 搜尋「把你的 firebaseConfig 貼在這裡」。
    </div>

    <!-- 大廳：建立或加入房間 -->
    <div id="lobby" class="card">
        <label for="nameInput">你的暱稱</label>
        <input id="nameInput" maxlength="12" placeholder="例如：小明" autocomplete="off">
        <div class="row">
            <button id="createBtn" class="btn btn-primary">建立房間</button>
        </div>
        <div class="divider">或輸入房號加入</div>
        <input id="codeInput" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off">
        <div class="row">
            <button id="joinBtn" class="btn btn-outline">加入房間</button>
        </div>
        <p id="lobbyMsg" class="msg"></p>
    </div>

    <!-- 房間：對戰畫面 -->
    <div id="room" class="hidden">
        <div class="card">
            <div class="room-head">
                <div>
                    <label style="margin:0 0 6px">房號</label>
                    <div id="roomCode" class="room-code">----</div>
                </div>
                <button id="copyBtn" class="copy">複製房號</button>
            </div>
        </div>

        <div class="card">
            <div class="players">
                <div class="player">
                    <div id="meName" class="name">你</div>
                    <div id="meState" class="state">—</div>
                    <div id="meScore" class="score">0</div>
                </div>
                <div class="vs">VS</div>
                <div class="player">
                    <div id="opName" class="name">等待對手…</div>
                    <div id="opState" class="state">—</div>
                    <div id="opScore" class="score">0</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div id="roundLabel" class="eyebrow" style="display:block;text-align:center">第 1 局</div>
            <div id="status" class="status">等待對手加入…</div>

            <!-- 出拳按鈕 -->
            <div id="hands" class="hands">
                <button class="hand" data-choice="rock">✊<span>石頭</span></button>
                <button class="hand" data-choice="scissors">✌️<span>剪刀</span></button>
                <button class="hand" data-choice="paper">🖐️<span>布</span></button>
            </div>

            <!-- 結果（雙方都出拳後才顯示） -->
            <div id="resultBox" class="hidden">
                <div class="reveal">
                    <div><div id="meHand" class="big">✊</div><small>你</small></div>
                    <div class="vs">VS</div>
                    <div><div id="opHand" class="big">✊</div><small>對手</small></div>
                </div>
                <div id="resultText" class="result">平手</div>
                <div class="row" style="margin-top:16px">
                    <button id="againBtn" class="btn btn-primary">再來一局</button>
                </div>
            </div>
        </div>

        <div class="row">
            <button id="leaveBtn" class="btn btn-outline">離開房間</button>
        </div>
    </div>

    <p class="foot">Firebase Realtime Database · 每間房 2 人</p>
</div>

<script>
// ↓↓↓ 把你的 firebaseConfig 貼在這裡（整段換掉，要有 databaseURL） ↓↓↓
const firebaseConfig = {
    apiKey: "AIzaSyAmseFLKRgbf8ClB6iDdWHebj3NRehqBu4",
    authDomain: "rps-411219032.firebaseapp.com",
    databaseURL: "https://rps-411219032-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "rps-411219032",
    storageBucket: "rps-411219032.firebasestorage.app",
    messagingSenderId: "200273774436",
    appId: "1:200273774436:web:1f67b566ffbbfd41d21c71"
};
// ↑↑↑ 把你的 firebaseConfig 貼在這裡 ↑↑↑

const HANDS = { rock: '✊', scissors: '✌️', paper: '🖐️' };
const BEATS = { rock: 'scissors', scissors: 'paper', paper: 'rock' }; // 左邊贏右邊

const $ = (id) => document.getElementById(id);
let db = null;
let roomRef = null;   // rooms/房號
let code = '';        // 房號
let me = '';          // 'p1' 或 'p2'
let op = '';          // 對手的位置
let room = null;      // 最新的房間資料

// ---------- 初始化 ----------
const configReady = !!(firebaseConfig.apiKey && firebaseConfig.databaseURL);
if (configReady) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
} else {
    $('configBanner').classList.remove('hidden');
}
try { $('nameInput').value = localStorage.getItem('rps-name') || ''; } catch (e) {}

function getName() {
    const name = $('nameInput').value.trim();
    if (!name) { showLobbyMsg('請先輸入暱稱'); return ''; }
    try { localStorage.setItem('rps-name', name); } catch (e) {}
    return name;
}
function showLobbyMsg(text) { $('lobbyMsg').textContent = text; }
function needConfig() {
    if (configReady) return false;
    showLobbyMsg('還沒貼上 firebaseConfig，無法連線。');
    return true;
}
function newPlayer(name) { return { name, choice: '', online: true }; }

// ---------- 建立房間 ----------
$('createBtn').onclick = async () => {
    if (needConfig()) return;
    const name = getName(); if (!name) return;
    setLobbyBusy(true);
    try {
        // 隨機 4 位數房號，撞號就重抽
        for (let i = 0; i < 10; i++) {
            const c = String(Math.floor(1000 + Math.random() * 9000));
            const ref = db.ref('rooms/' + c);
            const res = await ref.transaction((cur) => {
                if (cur !== null) return; // 已有人用，放棄
                return { round: 1, created: Date.now(), players: { p1: newPlayer(name) } };
            });
            if (res.committed) { enterRoom(c, 'p1'); return; }
        }
        showLobbyMsg('建立失敗，請再按一次。');
    } catch (err) {
        showLobbyMsg('連線錯誤：' + err.message);
    } finally { setLobbyBusy(false); }
};

// ---------- 加入房間 ----------
$('joinBtn').onclick = async () => {
    if (needConfig()) return;
    const name = getName(); if (!name) return;
    const c = $('codeInput').value.trim();
    if (!/^[0-9]{4}$/.test(c)) { showLobbyMsg('房號要是 4 位數字'); return; }
    setLobbyBusy(true);
    let slot = '';
    let reason = '';
    try {
        const res = await db.ref('rooms/' + c).transaction((cur) => {
            if (cur === null) { reason = 'none'; return null; } // 房間不存在（回傳 null 讓 Firebase 跟伺服器確認）
            const p = cur.players || {};
            // 找空位：沒人、或原本的人已離開
            slot = (!p.p1 || !p.p1.online) ? 'p1' : (!p.p2 || !p.p2.online) ? 'p2' : '';
            if (!slot) { reason = 'full'; return; }             // 房間已滿
            reason = '';
            p[slot] = newPlayer(name);
            const other = slot === 'p1' ? 'p2' : 'p1';
            if (p[other]) p[other].choice = '';
            // 新對手加入：從第 1 局、0 比 0 重新開始
            return { ...cur, players: p, round: 1, history: null };
        });
        if (res.committed && res.snapshot.exists()) enterRoom(c, slot);
        else showLobbyMsg(reason === 'full' ? '房間已滿（每間最多 2 人）' : '找不到這個房號');
    } catch (err) {
        showLobbyMsg('連線錯誤：' + err.message);
    } finally { setLobbyBusy(false); }
};

function setLobbyBusy(b) { $('createBtn').disabled = b; $('joinBtn').disabled = b; if (b) showLobbyMsg(''); }

// ---------- 進入房間，開始監聽 ----------
function enterRoom(c, slot) {
    code = c; me = slot; op = slot === 'p1' ? 'p2' : 'p1';
    roomRef = db.ref('rooms/' + code);
    // 斷線（關掉分頁、網路斷）時自動標記離開
    roomRef.child('players/' + me + '/online').onDisconnect().set(false);
    roomRef.on('value', onRoom);
    $('roomCode').textContent = code;
    $('lobby').classList.add('hidden');
    $('room').classList.remove('hidden');
}

function onRoom(snap) {
    room = snap.val();
    if (!room) { leaveRoom('房間已關閉'); return; }
    const players = room.players || {};
    const mine = players[me] || {};
    const theirs = players[op];
    const round = room.round || 1;

    // 雙方都出拳 → 記錄這局（兩邊寫入的內容相同，重複寫也沒關係）
    if (mine.choice && theirs && theirs.choice && !(room.history && room.history[round])) {
        roomRef.child('history/' + round).set({ p1: players.p1.choice, p2: players.p2.choice });
    }

    // 比分：從每一局的紀錄算出來，兩邊結果一定一致
    let myScore = 0, opScore = 0;
    Object.values(room.history || {}).forEach((h) => {
        const r = judge(h[me], h[op]);
        if (r === 'win') myScore++; else if (r === 'lose') opScore++;
    });

    // 玩家資訊
    $('meName').textContent = mine.name || '你';
    $('meScore').textContent = myScore;
    $('opScore').textContent = opScore;
    $('roundLabel').textContent = '第 ' + round + ' 局';

    const opHere = theirs && theirs.online;
    $('opName').textContent = theirs ? theirs.name : '等待對手…';
    setState('meState', mine.choice ? '已出拳 ✓' : '尚未出拳', mine.choice ? 'ok' : '');
    if (!theirs) setState('opState', '尚未加入', '');
    else if (!theirs.online) setState('opState', '對手已離開', 'off');
    else setState('opState', theirs.choice ? '已出拳 ✓' : '思考中…', theirs.choice ? 'ok' : '');

    const bothPicked = mine.choice && theirs && theirs.choice;
    const hands = document.querySelectorAll('.hand');
    hands.forEach((b) => {
        b.classList.toggle('picked', b.dataset.choice === mine.choice);
        b.disabled = !opHere || !!mine.choice;
    });

    if (bothPicked) {
        // 公布結果
        $('hands').classList.add('hidden');
        $('resultBox').classList.remove('hidden');
        $('meHand').textContent = HANDS[mine.choice];
        $('opHand').textContent = HANDS[theirs.choice];
        const r = judge(mine.choice, theirs.choice);
        const el = $('resultText');
        el.textContent = r === 'win' ? '你贏了！🎉' : r === 'lose' ? '你輸了 😵' : '平手 🤝';
        el.className = 'result pop ' + r;
        $('status').textContent = opHere ? '本局結束' : '對手已離開';
        $('status').className = 'status' + (opHere ? '' : ' off');
        $('againBtn').disabled = !opHere;
    } else {
        $('hands').classList.remove('hidden');
        $('resultBox').classList.add('hidden');
        let text, cls = '';
        if (!theirs) text = '等待對手加入…把房號給對方';
        else if (!theirs.online) { text = '對手已離開'; cls = ' off'; }
        else if (!mine.choice) text = '請出拳！';
        else text = '等對手出拳…（對方看不到你出什麼）';
        $('status').textContent = text;
        $('status').className = 'status' + cls;
    }
}

function setState(id, text, cls) { const el = $(id); el.textContent = text; el.className = 'state' + (cls ? ' ' + cls : ''); }
function judge(a, b) { if (!a || !b) return ''; if (a === b) return 'draw'; return BEATS[a] === b ? 'win' : 'lose'; }

// ---------- 出拳 ----------
document.querySelectorAll('.hand').forEach((btn) => {
    btn.onclick = () => {
        if (!roomRef || btn.disabled) return;
        roomRef.child('players/' + me + '/choice').set(btn.dataset.choice);
    };
});

// ---------- 再來一局 ----------
$('againBtn').onclick = () => {
    if (!roomRef || !room) return;
    const round = room.round || 1;
    roomRef.transaction((cur) => {
        if (!cur) return;
        if ((cur.round || 1) !== round) return cur; // 對方已經按過了
        cur.round = round + 1;
        Object.values(cur.players || {}).forEach((p) => { p.choice = ''; });
        return cur;
    });
};

// ---------- 離開 ----------
$('leaveBtn').onclick = async () => {
    if (roomRef) {
        const other = room && room.players && room.players[op];
        if (other && other.online) await roomRef.child('players/' + me + '/online').set(false);
        else await roomRef.remove(); // 兩人都走了就把房間刪掉
    }
    leaveRoom('');
};

function leaveRoom(text) {
    if (roomRef) {
        roomRef.off('value', onRoom);
        roomRef.child('players/' + me + '/online').onDisconnect().cancel();
    }
    roomRef = null; room = null; code = ''; me = ''; op = '';
    $('room').classList.add('hidden');
    $('lobby').classList.remove('hidden');
    showLobbyMsg(text);
}

// ---------- 小工具 ----------
$('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(code); $('copyBtn').textContent = '已複製 ✓'; }
    catch (e) { $('copyBtn').textContent = code; }
    setTimeout(() => { $('copyBtn').textContent = '複製房號'; }, 1500);
};
$('codeInput').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });
$('codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });
// 網址帶房號（rps.html?room=1234）時自動填入
const qsRoom = new URLSearchParams(location.search).get('room');
if (qsRoom && /^[0-9]{4}$/.test(qsRoom)) $('codeInput').value = qsRoom;
</script>
</body>
</html>
