<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="查看台北或所在地的即時天氣與未來一週預報，取得帶傘、穿搭、跑步與夜間外出建議。">
    <meta name="theme-color" content="#0a0d19">
    <title>天氣預報 | Meng-Jie</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZSVL2PNT60"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-ZSVL2PNT60');
    </script>
    <style>
        :root{color-scheme:dark;--ink:#f3f6ff;--muted:#a9b6ce;--accent:#5df0a8;--line:#25334c;--panel:#10182a}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(ellipse at 80% 0%,#142e36,transparent 50rem),#0a0d19;font:16px/1.6 'Noto Sans TC',system-ui,sans-serif}
        main{max-width:1040px;margin:auto;padding:clamp(20px,5vw,56px)}
        a{color:var(--accent);text-underline-offset:4px}
        header{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:26px 0 10px}
        h1,h2,h3,p{margin:0}
        h1{font-size:clamp(34px,7vw,58px);letter-spacing:-.04em;line-height:1.2}
        h2{font-size:23px;margin-bottom:12px}
        h3{font-size:16px}
        button{font:inherit;font-weight:700;padding:10px 18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#06271c;cursor:pointer}
        button:disabled{opacity:.65;cursor:wait}
        button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
        .muted,#status,footer{color:var(--muted)}
        #status{min-height:1.7em;margin:0 0 12px;font-size:14px}
        .panel,.day,.tip{border:1px solid var(--line);border-radius:18px;background:var(--panel)}
        .panel{padding:clamp(18px,4vw,32px);background:linear-gradient(135deg,#132a34,#10182a 65%)}
        .current{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
        #temperature{font-size:clamp(54px,11vw,92px);font-weight:800;letter-spacing:-.08em;line-height:1}
        #condition{color:var(--accent);font-weight:700;margin:8px 0}
        #details{font-size:14px}
        section+section{margin-top:32px}
        .forecast,.tips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0;list-style:none;margin:0}
        .day,.tip{padding:13px 15px;overflow-wrap:anywhere}
        .day:first-child{border-color:#4d9978}
        .day .range{color:var(--ink);font-weight:700}
        .day p,.tip p{font-size:14px;color:var(--muted)}
        .tip h3{color:var(--accent);margin-bottom:4px}
        footer{border-top:1px solid var(--line);padding-top:16px;margin-top:28px;font-size:14px}
        @media(max-width:650px){.forecast,.tips{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media(max-width:380px){main{padding:16px}.day,.tip{padding:10px}}
    </style>
</head>
<body>
<main>
    <a href="index.html">← 回到個人首頁</a>
    <header>
        <h1>天氣預報</h1>
        <button id="locate" type="button">使用我的位置</button>
    </header>
    <p id="status" role="status">正在載入台北天氣…</p>
    <noscript><p>請啟用 JavaScript 以載入即時天氣。</p></noscript>

    <section class="panel" aria-labelledby="place">
        <div class="current">
            <div>
                <h2 id="place">台北・目前天氣</h2>
                <p id="condition">—</p>
                <p id="details" class="muted"></p>
            </div>
            <p id="temperature">—</p>
        </div>
    </section>
    <section aria-labelledby="forecast-title">
        <h2 id="forecast-title">今天與未來 7 天</h2>
        <ul id="forecast" class="forecast"></ul>
    </section>
    <section aria-labelledby="tips-title">
        <h2 id="tips-title">生活建議</h2>
        <ul id="tips" class="tips"></ul>
    </section>
    <footer>天氣資料來源 <a href="https://open-meteo.com/">Open-Meteo</a>。定位經同意後，座標會用於向 Open-Meteo 查詢當地預報。</footer>
</main>
<script>
    const taipei = { latitude: 25.033, longitude: 121.5654, name: '台北' };
    const ui = Object.fromEntries(
        ['locate','status','place','condition','details','temperature','forecast','tips']
            .map(id => [id, document.getElementById(id)])
    );
    const conditions = {
        0:'晴朗', 1:'大致晴朗', 2:'局部多雲', 3:'陰天', 45:'霧', 48:'霧',
        51:'毛毛雨', 53:'毛毛雨', 55:'毛毛雨', 56:'凍毛毛雨', 57:'凍毛毛雨',
        61:'小雨', 63:'雨', 65:'大雨', 66:'凍雨', 67:'凍雨',
        71:'小雪', 73:'雪', 75:'大雪', 77:'雪粒', 80:'陣雨', 81:'陣雨', 82:'強陣雨',
        85:'陣雪', 86:'陣雪', 95:'雷雨', 96:'雷雨伴冰雹', 99:'雷雨伴冰雹'
    };
    const weekday = new Intl.DateTimeFormat('zh-TW', { weekday:'short', timeZone:'UTC' });
    const degrees = value => Number.isFinite(value) ? Math.round(value) + '°C' : '—';
    const chance = value => Number.isFinite(value) ? value + '%' : '暫缺';
    const condition = code => conditions[code] ?? '天況暫缺';
    const wet = (probability, amount) => probability >= 40 || amount > 1;
    const dayRain = (daily, i) => (daily.rain_sum[i] ?? 0) + (daily.showers_sum[i] ?? 0);
    let displayedPlace;
    let activeRequest;

    function row(className, title, lines) {
        const item = document.createElement('li');
        item.className = className;
        const heading = document.createElement('h3');
        heading.textContent = title;
        item.append(heading);
        for (const [value, className] of lines) {
            const text = document.createElement('p');
            text.textContent = value;
            if (className) text.className = className;
            item.append(text);
        }
        return item;
    }

    function advice(current, daily, hourly) {
        const todayChance = daily.precipitation_probability_max[0];
        const todayRain = dayRain(daily, 0);
        const apparent = current.apparent_temperature;
        let clothing = '體感溫度暫缺，出門前先確認天氣。';
        if (Number.isFinite(apparent)) {
            if (apparent > 28) clothing = '短袖或透氣衣物';
            else if (apparent >= 22) clothing = '薄長袖';
            else if (apparent >= 16) clothing = '長袖加外套';
            else clothing = '厚外套';
            clothing += '。目前體感 ' + degrees(apparent) + '。';
            if (daily.temperature_2m_max[0] - daily.temperature_2m_min[0] >= 8)
                clothing += '日夜溫差大，可加帶一件外套。';
        }
        const hour = hourly.time.findIndex(time => time.slice(0,13) === current.time.slice(0,13));
        const runRain = hourly.precipitation_probability[hour];
        const wind = current.wind_speed_10m;
        const runKnown = [apparent, runRain, wind, current.weather_code].every(Number.isFinite);
        const canRun = runKnown && apparent >= 10 && apparent <= 28 && runRain < 40 && wind < 30 && current.weather_code < 95;
        const evening = hourly.time.flatMap((time, i) =>
            time.startsWith(daily.time[0]) && Number(time.slice(11,13)) >= 18 ? [i] : []);
        const eveningData = [
            evening.map(i => hourly.precipitation_probability[i]),
            evening.map(i => hourly.apparent_temperature[i]),
            evening.map(i => hourly.wind_speed_10m[i]),
            evening.map(i => hourly.weather_code[i])
        ];
        let nightText = '晚間資料暫缺。';
        if (evening.length === 6 && eveningData.every(values => values.every(Number.isFinite))) {
            const [rain, temp, wind, codes] = eveningData;
            const rainMax = Math.max(...rain);
            const tempMin = Math.min(...temp);
            const windMax = Math.max(...wind);
            const canGo = rainMax < 40 && tempMin >= 15 && windMax < 30 && Math.max(...codes) < 95;
            nightText = (canGo ? '適合夜間外出。' : '建議安排室內活動。')
                + '18–23 時最高降雨機率 ' + rainMax + '%，最低體感 ' + degrees(tempMin)
                + '，最大風速 ' + Math.round(windMax) + ' km/h。';
        }
        const umbrella = wet(todayChance, todayRain) ? '建議帶傘。'
            : Number.isFinite(todayChance) ? '降雨機率偏低，可視行程決定。' : '先確認雨勢再出門。';
        return [
            ['帶傘', umbrella + '今日最高降雨機率 ' + chance(todayChance) + '。'],
            ['穿搭', clothing],
            ['跑步', runKnown
                ? (canRun ? '目前適合戶外跑步。' : '建議改為室內運動。') + '目前體感 '
                    + degrees(apparent) + '，本時段降雨 ' + chance(runRain) + '，風速 ' + Math.round(wind) + ' km/h。'
                : '目前資料不足，出門前請確認體感、降雨與風速。'],
            ['夜遊', nightText]
        ];
    }

    function render(data, place) {
        const { current, daily, hourly } = data;
        if (daily?.time?.length !== 8 || !Number.isFinite(current?.temperature_2m) || !hourly?.time)
            throw new Error('Incomplete forecast');
        const days = daily.time.map((date, index) => {
            const probability = daily.precipitation_probability_max[index];
            const name = index === 0 ? '今天' : weekday.format(new Date(date + 'T00:00:00Z'));
            const rain = wet(probability, dayRain(daily, index)) ? '可能下雨'
                : Number.isFinite(probability) ? '降雨機率低' : '降雨資料暫缺';
            return row('day', name + ' ' + date.slice(5).replace('-', '/'), [
                [degrees(daily.temperature_2m_min[index]) + ' ～ ' + degrees(daily.temperature_2m_max[index]), 'range'],
                [condition(daily.weather_code[index])],
                [rain + ' · ' + chance(probability)]
            ]);
        });
        const tips = advice(current, daily, hourly).map(([title, text]) => row('tip', title, [[text]]));
        ui.place.textContent = place.name + '・目前天氣';
        ui.temperature.textContent = degrees(current.temperature_2m);
        ui.condition.textContent = condition(current.weather_code);
        ui.details.textContent = '體感 ' + degrees(current.apparent_temperature)
            + ' · 當地時間 ' + current.time.slice(11,16);
        ui.forecast.replaceChildren(...days);
        ui.tips.replaceChildren(...tips);
        displayedPlace = place;
    }

    async function loadForecast(place, notice = '') {
        activeRequest?.abort();
        const request = new AbortController();
        activeRequest = request;
        const timer = setTimeout(() => request.abort(), 10000);
        ui.status.textContent = '正在載入' + place.name + '天氣…';
        try {
            const params = new URLSearchParams({
                latitude: place.latitude,
                longitude: place.longitude,
                timezone: 'auto',
                forecast_days: '8',
                current: 'temperature_2m,apparent_temperature,weather_code,wind_speed_10m',
                daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,rain_sum,showers_sum',
                hourly: 'precipitation_probability,apparent_temperature,wind_speed_10m,weather_code'
            });
            const response = await fetch('https://api.open-meteo.com/v1/forecast?' + params, { signal: request.signal });
            if (!response.ok) throw new Error('Forecast request failed');
            const data = await response.json();
            if (activeRequest !== request) return;
            render(data, place);
            ui.status.textContent = notice;
        } catch {
            if (activeRequest !== request) return;
            if (place !== taipei && displayedPlace !== taipei) {
                return loadForecast(taipei, '所在地天氣暫時無法載入，已顯示台北。');
            }
            ui.status.textContent = displayedPlace
                ? place.name + '天氣暫時無法更新，目前顯示' + displayedPlace.name + '的上次資料。'
                : '台北天氣暫時無法載入，請稍後重新整理。';
        } finally {
            clearTimeout(timer);
        }
    }

    ui.locate.addEventListener('click', async () => {
        ui.locate.disabled = true;
        ui.status.textContent = '正在取得位置…';
        try {
            const { coords } = await new Promise((resolve, reject) => {
                if (!navigator.geolocation) return reject(new Error('Geolocation unavailable'));
                navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000, maximumAge: 300000 });
            });
            await loadForecast({
                latitude: coords.latitude.toFixed(3),
                longitude: coords.longitude.toFixed(3),
                name: '你的所在地'
            });
        } catch {
            await loadForecast(taipei, '無法取得位置，已顯示台北。');
        } finally {
            ui.locate.disabled = false;
        }
    });

    loadForecast(taipei);
</script>
</body>
</html>
