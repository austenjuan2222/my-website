        .slots{list-style:none;display:grid;gap:10px;margin-top:6px}

        .slot.best{background:#14161c;color:#f4f1e8;border-color:#14161c}

    <header class="head">
        <span class="eyebrow">Tool 03 · Sleep cycles</span>
        <h1>幾點睡，<br>起床才不累？</h1>
        <p class="lead">睡眠大約 90 分鐘一個循環。在循環結束時醒來會比較清醒，在熟睡中被鬧鐘叫醒就會昏沉一整個早上。</p>
    </header>

    <section class="panel">
        <div class="seg" role="group" aria-label="計算方式">
            <button type="button" data-mode="wake" aria-pressed="true">我要幾點起床</button>
            <button type="button" data-mode="now" aria-pressed="false">現在就睡</button>
        </div>
        <div class="row" style="margin-top:18px">
            <label class="field" id="wake-field"><span class="label">起床時間</span>
                <input class="input" id="wake" type="time" value="07:30"></label>
            <label class="field"><span class="label">通常幾分鐘睡著</span>
                <input class="input" id="fall" type="number" inputmode="numeric" min="0" max="90" step="1" value="15"></label>
        </div>
    </section>

    <section class="receipt" aria-live="polite">
        <p class="muted" style="font-size:13px;letter-spacing:.12em" id="result-title">建議上床時間</p>
        <ul class="slots" id="slots"></ul>
        <p class="tip muted" id="tip"></p>
        <p class="muted" id="ics-status" role="status" style="min-height:1.4em;font-size:14px"></p>
    </section>

    <p class="foot">睡眠週期因人而異（約 80～110 分鐘），結果僅供參考。 · <a href="noise.html">找安靜的地方讀書？用噪音計 →</a></p>
</div>

<script>
const CYCLE = 90;
const $ = (id) => document.getElementById(id);
let mode = 'wake';

/**
 * 睡眠週期計算（純函式）
 * mode 'wake'：給起床時間，回傳建議上床時間；mode 'now'：給現在時間，回傳建議起床時間
 * base: Date；fall: 入睡分鐘數 → [{at: Date, cycles, hours}]
 */
function sleepPlan(mode, base, fall) {
    const f = Math.min(90, Math.max(0, Number(fall) || 0));
    const out = [];
    for (const n of [6, 5, 4, 3]) {
        const mins = n * CYCLE + f;
        const at = new Date(base.getTime() + (mode === 'wake' ? -mins : mins) * 60000);
        out.push({ at, cycles: n, hours: n * CYCLE / 60 });
    }
    return mode === 'wake' ? out : out.reverse();
}
window.sleepPlan = sleepPlan;

const pad = (n) => String(n).padStart(2, '0');
const hhmm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
function dayLabel(d) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((new Date(d).setHours(0, 0, 0, 0) - today) / 86400000);
    return diff === 0 ? '今天' : diff === 1 ? '明天' : diff === -1 ? '昨天' : (d.getMonth() + 1) + '/' + d.getDate();
}

function nextWake() {
    const [h, m] = ($('wake').value || '07:30').split(':').map(Number);
    const d = new Date(); d.setSeconds(0, 0); d.setHours(h, m);
    if (d <= new Date()) d.setDate(d.getDate() + 1);
    return d;
}

function render() {
    const base = mode === 'wake' ? nextWake() : new Date();
    const plan = sleepPlan(mode, base, $('fall').value);
    $('result-title').textContent = mode === 'wake' ? '要在 ' + dayLabel(base) + ' ' + hhmm(base) + ' 起床，建議這時候上床' : '現在上床，建議把鬧鐘設在';
    $('slots').innerHTML = '';
    plan.forEach(p => {
        const li = document.createElement('li');
        const past = p.at < new Date();
        li.className = 'slot' + (past ? ' past' : p.cycles >= 5 ? ' best' : '');
        const t = document.createElement('time');
        t.dateTime = p.at.toISOString(); t.textContent = hhmm(p.at);
        const meta = document.createElement('div'); meta.className = 'meta';
        meta.innerHTML = '<b>' + p.cycles + ' 個週期・睡 ' + p.hours + ' 小時</b><span class="muted">' + dayLabel(p.at) + (past ? '・已經過了' : p.cycles === 6 ? '・最充足' : p.cycles === 5 ? '・推薦' : p.cycles === 3 ? '・真的來不及才用' : '') + '</span>' +
            '<span class="moon" aria-hidden="true">' + '<i></i>'.repeat(p.cycles) + '</span>';
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'ics'; btn.textContent = '⏰ 提醒我';
        btn.setAttribute('aria-label', hhmm(p.at) + ' 加到行事曆');
        btn.addEventListener('click', () => downloadIcs(p.at));
        li.append(t, meta, btn);
        $('slots').appendChild(li);
    });
    const allPast = plan.every(p => p.at < new Date());
    $('tip').textContent = mode === 'wake' && allPast ? '這些時間都過了 😴 改按上面的「現在就睡」，看鬧鐘該設幾點。' : mode === 'wake'
        ? '黑色的是推薦時段（睡滿 5～6 個週期）。已經包含 ' + (Number($('fall').value) || 0) + ' 分鐘入睡時間。'
        : '已經包含 ' + (Number($('fall').value) || 0) + ' 分鐘入睡時間。睡不到 3 個週期的話，乾脆小睡 20 分鐘比較不會昏。';
}

/** 產生 .ics：時間到提醒（上床或起床） */
function downloadIcs(at) {
    const z = (d) => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
    const title = mode === 'wake' ? '🌙 該上床睡覺了' : '⏰ 起床（睡眠週期結束）';
    const end = new Date(at.getTime() + 10 * 60000);
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Meng-Jie//sleep//ZH', 'BEGIN:VEVENT',
        'UID:' + at.getTime() + '@meng-jie-sleep', 'DTSTAMP:' + z(new Date()), 'DTSTART:' + z(at), 'DTEND:' + z(end),
        'SUMMARY:' + title, 'DESCRIPTION:睡眠週期計算機 https://austenjuan2222.github.io/my-website/sleep.html',
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + title, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'sleep-' + hhmm(at).replace(':', '') + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    $('ics-status').textContent = '已下載 ' + hhmm(at) + ' 的提醒，打開檔案就能加到行事曆。';
    if (window.gtag) gtag('event', 'sleep_reminder', { mode });
}

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('wake-field').classList.toggle('hidden', mode !== 'wake');
    render();
}));
$('wake').addEventListener('input', render);
$('fall').addEventListener('input', render);
setInterval(() => { if (mode === 'now') render(); }, 30000);
render();
</script>
</body>
